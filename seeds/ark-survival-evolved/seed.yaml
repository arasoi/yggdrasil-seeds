# ARK's own ini files, patched rather than rewritten.
#
# `patch` is the only mode that is safe here, and the reason is worth stating.
# ARK writes both of these itself — GameUserSettings.ini on first run and again
# on shutdown, adding any key it did not find — so a mode that rewrote the file
# wholesale (`always`) would throw away everything the game had added, and
# `once` would mean no setting here ever reached a server that had already
# started. `patch` sets the keys this seed names and leaves every other line,
# comment and section exactly as it found it (ADR-077).
#
# On a brand-new server the file does not exist yet, so the first patch writes
# only the keys named above. That is safe for Unreal in a way it was NOT for
# Vintage Story's JSON (ADR-084): Unreal resolves a missing ini key to that
# property's compiled default, key by key, so an absent key means "use the
# game's own default" rather than "this collection is empty".
#
# Both are marked importable, which is the migration path for a server somebody
# already configured by hand: read the file back off the node and adopt the
# values this seed recognises, rather than having the next rebuild quietly
# patch over them.
config:
  files:
    - path: config/LinuxServer/GameUserSettings.ini
      parser: ini
      manage: patch
      importable: true
    - path: config/LinuxServer/Game.ini
      parser: ini
      manage: patch
      importable: true

# mode: port rather than a log pattern, deliberately. Community server tools
# widely cite "Server has completed startup!" as ASE's own readiness line —
# distinct from ASA's "has successfully started!" — but it has not been seen
# in real output from this seed's own install, and a wrong readiness pattern
# strands a healthy server in `starting` for the whole timeout rather than
# merely delaying it. Port needs no game-specific knowledge at all, which is
# the documented right first choice for a seed added blind (docs/seed-spec.md
# §9.1). Revisit once a real depot has been run and the line confirmed.
#
# `game` itself is UDP and mode: port only ever dials TCP -- naming it would
# never succeed and would silently burn the whole timeout on every start
# (docs/conventions.md's own recorded pitfall for this exact mode). `rcon` is
# the only TCP port this seed declares, and it binds reliably: the command
# always passes RCONEnabled=True and admin_password always carries a default
# ("changeme"), so RCON is never conditionally absent the way a bare port:
# game seed might have one. The trade is real and worth naming: RCON can bind
# before the world save has finished loading, so this may report ready a
# little ahead of the game genuinely being able to serve players.
ready:
  mode: port
  port: rcon
  timeout: 300s

# No crash block, for the same reason ASA's own seed leaves one commented out
# rather than declared: a wrong crash pattern stops a healthy server, which is
# a materially worse failure than a wrong readiness pattern, and nothing here
# has been checked against real output.
#
# crash:
#   mode: log
#   pattern: "Fatal error"

backup:
  include: [saved, config]
