id: palworld
schema: 3
name: Palworld
icon: "🐾"
description: >
  Open-world survival and creature collection. Players catch and deploy Pals to
  fight, build and automate, alone or with up to 31 others on one server.
version: "1.0.5"

# amd64 only. Pocketpair ship no arm64 build of the dedicated server, and a
# node declaring the wrong architecture is refused at creation rather than
# crash-looping on an exec-format error (ADR-016).
architectures: [amd64]

install:
  # Each server gets its own copy. Two Palworld worlds have no reason to share
  # one install the way ARK's identical map data does -- the same call Valheim's
  # and Paper's seeds make.
  shared: false
  mount: { path: /game, mode: ro }
  # A steamcmd step runs in a container, so the seed names which one (ADR-057).
  image: { base: steamcmd }
  steps:
    - op: steamcmd
      # The *dedicated server* app, not the game (1623730). Anonymous login
      # works, and there is a native Linux build, so no Proton wrapper is
      # needed the way ARK Survival Ascended needs one.
      app_id: 2394010
    # PalServer.sh is no longer the entry point (see the command below), and it
    # was the thing that chmod +x'd the binary before exec'ing it. SteamCMD
    # preserves the executable bit on download, so this is belt and braces --
    # but it runs while the install directory is still writable, which is the
    # only moment anything can set a mode inside it.
    - op: chmod
      path: Pal/Binaries/Linux/PalServer-Linux-Shipping
      mode: "0755"

server:
  writable_paths:
    # Everything the game writes lives under Pal/Saved: the world, the player
    # data, its own logs, and the config file below.
    - { from: saved, to: /game/Pal/Saved }
    # HOME for the container's user. steamclient.so is staged here at start --
    # see the command -- so it has to be per-server and writable, never part of
    # the read-only install (ADR-018, and ADR-070's lesson about a HOME the
    # container's own uid cannot write).
    - { from: home, to: /home/steam }
  # No file_denylist. It should list PalWorldSettings.ini -- the seed rewrites
  # that file on every rebuild, so offering it in the browser invites an edit
  # the next rebuild discards, which is exactly what the field is for.
  #
  # It cannot, yet. The denylist is enforced on every file operation on the
  # node, and the seed's own config write is a file operation, so denying the
  # file the seed manages makes the seed unable to write it:
  #
  #     write config file saved/Config/LinuxServer/PalWorldSettings.ini:
  #     this seed does not allow file operations on that path
  #
  # Every rebuild then failed, leaving the containers on their previous
  # configuration -- and because the failure surfaced only as "the containers
  # could not be rebuilt", it read as a container problem rather than a config
  # one. Restore this once a seed's own writes are exempt from its browser
  # denylist.

containers:
  - role: game
    primary: true
    # base-steamcmd rather than base-linux, which is what Valheim uses for its
    # own native Linux build. The difference is steamclient.so: PalServer
    # dlopen()s $HOME/.steam/sdk64/steamclient.so, and SteamCMD's own copy is
    # the one to stage there -- the same file, from the same place, that
    # ygg-proton stages for ARK (ADR-047's final amendment). base-linux does
    # not carry it.
    image: { base: steamcmd }
    # One readable line would be better, and this is the shortest honest
    # version of it:
    #
    #   * The staging step is why this is a shell command at all. Without it
    #     PalServer logs `dlopen failed trying to load: steamclient.so` and,
    #     depending on the build, either carries on degraded or never finishes
    #     starting. Copying it is cheap and removes the question.
    #   * -port is the allocated port, never the seed's declared default
    #     (ADR-061). PublicPort in the config file is set from the same
    #     allocation, so what the server binds and what it advertises agree.
    #   * -log is what puts the engine's output on stdout. Without it Unreal
    #     writes to Pal/Saved/Logs and prints nothing to the console at all --
    #     so a server that is running perfectly well shows an empty console,
    #     and every line an operator did see up to this point came from the
    #     shell rather than from the game. It is also the prerequisite for
    #     anything reading the output: a logs.values or logs.events rule
    #     matches what the container prints, and without this it prints
    #     nothing to match.
    #   * The three -use/-No flags are Pocketpair's own documented performance
    #     switches for dedicated servers.
    #
    # The shipping binary is exec'd directly rather than through PalServer.sh,
    # which 1.0.0 used. That script writes into the install directory on every
    # start, and an install is mounted read-only, so it cannot:
    #
    #     cp: cannot create regular file '/game/Pal/Binaries/Linux/steamclient.so':
    #         Read-only file system
    #     Failed to copy the file: /game/linux64/steamclient.so ->
    #         /game/Pal/Binaries/Linux/steamclient.so
    #
    # 1.0.0 anticipated this and named the wrong write: it expected the script's
    # chmod +x to be what failed, and reasoned that a printed error was all it
    # would cost. The chmod may well fail too. What an operator actually hit
    # first is the steamclient.so copy, and pre-placing that file does not help,
    # because a copy onto a read-only filesystem fails whether or not the
    # destination is already correct.
    #
    # Bypassing the script costs nothing here. The two things it does are stage
    # steamclient.so -- which the line below already does, into
    # $HOME/.steam/sdk64, the path PalServer actually dlopen()s -- and chmod the
    # binary, now an install step where the directory is still writable. `Pal`
    # is the project name the script passes as the first argument; Unreal needs
    # it and dropping it is the one way to get this wrong quietly.
    command: >-
      sh -c 'mkdir -p "$HOME/.steam/sdk64" &&
      cp -n /opt/steamcmd/linux64/steamclient.so "$HOME/.steam/sdk64/steamclient.so" || true;
      exec /game/Pal/Binaries/Linux/PalServer-Linux-Shipping Pal
      -log
      -port={{.Ports.game}}
      -players={{.Vars.server_player_max_num}}
      -useperfthreads -NoAsyncLoadingThread -UseMultithreadForDS
      {{.Vars.community_server}}'
    workdir: /game
    env:
      # base-steamcmd honours HOME (its own descriptor says so), and the
      # writable path above is what makes this one writable.
      HOME: /home/steam
      # Unreal Engine refuses to run as root -- "Refusing to run with the root
      # privileges.", no flag and no override -- and a container otherwise runs
      # as the image's default user, which is root. Without this the server
      # prints that one line and stops, having done nothing else.
      #
      # The uid is not named here on purpose: the image takes it from whoever
      # owns HOME, which is the agent that created the writable paths on the
      # host. That is the only uid which leaves the game able to write its saves
      # and the agent able to read them back for a backup, and it is right on a
      # fleet whose agent runs as root and one whose agent does not, without a
      # seed having to know which.
      YGG_DROP_PRIVS: "1"
      # HOME is made writable by the image without being asked; anything else
      # the game writes to has to be named. Pal/Saved is the world, the player
      # data and the config this seed renders.
      YGG_CHOWN_DIRS: "/game/Pal/Saved"
    ports:
      - { name: game, protocol: udp, default: 8211, kind: game }
      # RCON and the REST API are both allocated whether or not they are turned
      # on: a port an operator can enable later is cheaper to hold than one they
      # cannot get without a rebuild, and a node's range is not scarce (ADR-076).
      - { name: rcon, protocol: tcp, default: 25575, kind: rcon }
      - { name: rest, protocol: tcp, default: 8212, kind: web }
      #
      # No query port. Palworld's own config file has no query-port key among
      # its 119, which is the authority this seed has -- several hosting guides
      # mention 27015, but nothing in the shipped configuration asks for it, and
      # declaring a port the game never binds would allocate a number that means
      # nothing.

config:
  files:
    - path: saved/Config/LinuxServer/PalWorldSettings.ini
      source_path: configs/PalWorldSettings.ini.tmpl
      # Rewritten wholesale on every rebuild, which is the default and the only
      # option here: the entire configuration is a single ini key whose value is
      # one comma-separated tuple, so `manage: patch` could only ever set that
      # one key to a whole new tuple. That is also why every control below is a
      # `variable` rather than a `setting` -- a setting's `to: {file, key}`
      # destination addresses one key, and there is only one.
      manage: always

ready:
  # mode: port, not a log pattern. Palworld does print a startup line, but
  # nobody here has captured one from a real run, and this project does not put
  # an unverified pattern in a field where it would look active (ADR-067). The
  # port needs no game-specific knowledge, which makes it the right first
  # choice for a game added without a server to watch (ADR-077).
  mode: port
  port: game
  timeout: 300s

# No crash block. `crash: {mode: log}` kills the pod so the ordinary exit path
# can restart it, so a wrong pattern does not mislabel a server -- it stops a
# healthy one. Nothing here has been checked against a real crash.

stop:
  # SIGTERM, with no console command: PalServer reads no commands on stdin, so
  # there is nothing to send it. The graceful path the game documents is an
  # RCON `Shutdown`, which this seed cannot reach from a stop spec.
  #
  # What bounds the loss is the game's own autosave, which the Performance
  # group exposes and which defaults to every 30 seconds. The timeout is
  # generous because a large world takes a while to flush.
  timeout: 120s
  then: SIGTERM

connect:
  # `copy` only, no `uri`: Palworld's join flow is pasting an address into the
  # client's "Join with IP" box, which takes exactly this host:port. There is no
  # URI scheme this project has watched a client honour, and an unverified link
  # that silently does nothing is worse than none (ADR-067's honesty rule).
  label: "Join with IP"
  copy: "{{.Endpoint.game}}"

backup:
  # The whole writable root: the world, the player saves and the config the
  # seed renders. `home` is deliberately not separated out -- it holds only a
  # staged copy of steamclient.so, which the next start recreates.
  include: [saved]

groups:
  - name: Server
    description: Identity, access and who may connect.
  - name: Remote access
    description: >-
      RCON and the REST API. Both authenticate with the admin password, so
      neither is written as enabled while that is blank.
  - name: World
    description: Time, difficulty and what spawns.
  - name: Rates
    description: Multipliers on progression and production.
  - name: Combat
    description: Damage dealt and taken.
  - name: Survival
    description: Hunger, stamina and regeneration.
  - name: Structures
    description: Building health and decay.
  - name: Gathering
    description: Nodes, drops and respawn.
  - name: Death and respawn
    description: What is lost on death and how long a respawn takes.
  - name: PvP
    description: Player-versus-player rules.
    collapsed: true
  - name: Guilds and bases
    description: Guild limits, base counts and building rules.
  - name: Travel and Palbox
    description: Fast travel and the Global Palbox.
    collapsed: true
  - name: Stat points
    description: Which stats players may spend points on.
    collapsed: true
  - name: Voice chat
    description: In-game voice and its falloff distances.
    collapsed: true
  - name: Performance
    description: >-
      Limits and intervals that trade responsiveness against server load.
      Worth changing only with a reason.
    collapsed: true
  - name: Misc
    description: >-
      Keys the game ships that the official guide does not document, plus aim
      assist. Exposed rather than hidden, since the game writes them.
    collapsed: true

# Every key in the game's own DefaultPalWorldSettings.ini, plus the one the
# official guide documents that the shipped file omits
# (bAllowEnemyCampSpawnNearBaseCamp). Defaults are read from that file rather
# than retyped from a guide.
#
# Three of its keys are absent on purpose: PublicPort, RCONPort and RESTAPIPort
# are allocated by the control plane, so the template renders them from the
# allocation instead of offering an operator a number the node may not honour
# (ADR-061).
variables:

  # ---- World -------------------------------------------------------------
  - name: difficulty
    group: World
    type: select
    label: Difficulty preset
    description: >-
      Game difficulty preset. None leaves the individual rates below in charge. Config
      key: Difficulty.
    default: "None"
    options:
      - { value: "None", label: "None (use the rates below)" }
      - { value: "Casual", label: "Casual" }
      - { value: "Normal", label: "Normal" }
      - { value: "Hard", label: "Hard" }
    editable: true
  - name: randomizer_type
    group: World
    type: select
    label: Pal randomizer
    description: >-
      Pal spawn randomization mode: None = no randomization; Region = randomize per
      region; All = fully randomized. Config key: RandomizerType.
    default: "None"
    options:
      - { value: "None", label: "None" }
      - { value: "Region", label: "Per region" }
      - { value: "All", label: "Fully randomized" }
    editable: true
  - name: randomizer_seed
    group: World
    label: Randomizer seed
    description: >-
      Seed value used when Pal spawn randomization mode is enabled. Config key:
      RandomizerSeed.
    default: ""
    editable: true
  - name: randomizer_pal_level_random
    group: World
    type: bool
    true_value: "True"
    false_value: "False"
    label: Randomize Pal levels
    description: >-
      If on, wild Pal levels are fully random. If off, levels are randomized within
      each area's intended range. Config key: bIsRandomizerPalLevelRandom.
    default: "False"
    editable: true
  - name: day_time_speed_rate
    group: World
    type: number
    label: Daytime speed
    description: >-
      Daytime progression speed. Config key: DayTimeSpeedRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: night_time_speed_rate
    group: World
    type: number
    label: Nighttime speed
    description: >-
      Nighttime progression speed. Config key: NightTimeSpeedRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: enable_invader_enemy
    group: World
    type: bool
    true_value: "True"
    false_value: "False"
    label: Invaders
    description: >-
      Enable raids on bases by invaders. Config key: bEnableInvaderEnemy.
    default: "True"
    editable: true
  - name: start_location_select_by_map
    group: World
    type: bool
    true_value: "True"
    false_value: "False"
    label: Choose start location
    description: >-
      Whether to allow players to choose their starting location. Config key:
      bIsStartLocationSelectByMap.
    default: "False"
    editable: true
  - name: supply_drop_span
    group: World
    type: number
    label: Supply drop interval
    description: >-
      Meteorite and supply drop interval, in minutes. Config key: SupplyDropSpan.
    min: 1
    max: 1440
    step: 1
    default: "180"
    editable: true
  - name: enable_predator_boss_pal
    group: World
    type: bool
    true_value: "True"
    false_value: "False"
    label: Predator Pals
    description: >-
      Enable Predator Pals. Config key: EnablePredatorBossPal.
    default: "True"
    editable: true

  # ---- Rates -------------------------------------------------------------
  - name: exp_rate
    group: Rates
    type: number
    label: EXP
    description: >-
      EXP gain multiplier. Config key: ExpRate.
    min: 0.1
    max: 20.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: pal_capture_rate
    group: Rates
    type: number
    label: Capture rate
    description: >-
      Capture rate multiplier. Config key: PalCaptureRate.
    min: 0.1
    max: 20.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: pal_spawn_num_rate
    group: Rates
    type: number
    label: Pal spawn rate
    description: >-
      Pal spawn rate. Raising this impacts performance. Config key: PalSpawnNumRate.
    min: 0.1
    max: 3.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: pal_egg_default_hatching_time
    group: Rates
    type: number
    label: Huge egg hatch time
    description: >-
      Time to hatch a Huge Egg, in hours. Other eggs also take time to incubate.
      Config key: PalEggDefaultHatchingTime.
    min: 0.0
    max: 240.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: work_speed_rate
    group: Rates
    type: number
    label: Work speed
    description: >-
      Pal work speed multiplier. Config key: WorkSpeedRate.
    min: 0.1
    max: 10.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: item_weight_rate
    group: Rates
    type: number
    label: Item weight
    description: >-
      Item weight multiplier. Config key: ItemWeightRate.
    min: 0.0
    max: 10.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: equipment_durability_damage_rate
    group: Rates
    type: number
    label: Equipment durability loss
    description: >-
      Equipment durability loss multiplier. 0 disables durability loss. Config key:
      EquipmentDurabilityDamageRate.
    min: 0.0
    max: 10.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: item_corruption_multiplier
    group: Rates
    type: number
    label: Item corruption speed
    description: >-
      Item corruption speed multiplier. Config key: ItemCorruptionMultiplier.
    min: 0.0
    max: 10.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: monster_farm_action_speed_rate
    group: Rates
    type: number
    label: Ranch production speed
    description: >-
      Item production speed multiplier from grazing. Config key:
      MonsterFarmActionSpeedRate.
    min: 0.1
    max: 10.0
    step: 0.1
    default: "1.0"
    editable: true

  # ---- Combat ------------------------------------------------------------
  - name: pal_damage_rate_attack
    group: Combat
    type: number
    label: Pal damage dealt
    description: >-
      Damage dealt by Pals, multiplied. Config key: PalDamageRateAttack.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: pal_damage_rate_defense
    group: Combat
    type: number
    label: Pal damage taken
    description: >-
      Damage taken by Pals, multiplied. Config key: PalDamageRateDefense.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: player_damage_rate_attack
    group: Combat
    type: number
    label: Player damage dealt
    description: >-
      Damage dealt by players, multiplied. Config key: PlayerDamageRateAttack.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: player_damage_rate_defense
    group: Combat
    type: number
    label: Player damage taken
    description: >-
      Damage taken by players, multiplied. Config key: PlayerDamageRateDefense.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true

  # ---- Survival ----------------------------------------------------------
  - name: player_stomach_decrease_rate
    group: Survival
    type: number
    label: Player hunger drain
    description: >-
      Player hunger depletion rate multiplier. Config key: PlayerStomachDecreaceRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: player_stamina_decrease_rate
    group: Survival
    type: number
    label: Player stamina drain
    description: >-
      Player stamina depletion rate multiplier. Config key: PlayerStaminaDecreaceRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: player_auto_hp_regen_rate
    group: Survival
    type: number
    label: Player HP regen
    description: >-
      Player natural HP regeneration multiplier. Config key: PlayerAutoHPRegeneRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: player_auto_hp_regen_rate_in_sleep
    group: Survival
    type: number
    label: Player HP regen while sleeping
    description: >-
      Player HP regeneration while sleeping, multiplied. Config key:
      PlayerAutoHpRegeneRateInSleep.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: pal_stomach_decrease_rate
    group: Survival
    type: number
    label: Pal hunger drain
    description: >-
      Pal hunger depletion rate multiplier. Config key: PalStomachDecreaceRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: pal_stamina_decrease_rate
    group: Survival
    type: number
    label: Pal stamina drain
    description: >-
      Pal stamina depletion rate multiplier. Config key: PalStaminaDecreaceRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: pal_auto_hp_regen_rate
    group: Survival
    type: number
    label: Pal HP regen
    description: >-
      Pal natural HP regeneration multiplier. Config key: PalAutoHPRegeneRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: pal_auto_hp_regen_rate_in_sleep
    group: Survival
    type: number
    label: Pal HP regen in Palbox
    description: >-
      Pal HP regeneration while sleeping in the Palbox, multiplied. Config key:
      PalAutoHpRegeneRateInSleep.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true

  # ---- Structures --------------------------------------------------------
  - name: build_object_hp_rate
    group: Structures
    type: number
    label: Structure health
    description: >-
      Structure health multiplier. Config key: BuildObjectHpRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: build_object_damage_rate
    group: Structures
    type: number
    label: Structure damage taken
    description: >-
      Damage multiplier to buildings. Config key: BuildObjectDamageRate.
    min: 0.1
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: build_object_deterioration_damage_rate
    group: Structures
    type: number
    label: Structure decay
    description: >-
      Building decay speed multiplier. 0 disables decay entirely. Config key:
      BuildObjectDeteriorationDamageRate.
    min: 0.0
    max: 5.0
    step: 0.1
    default: "1.0"
    editable: true

  # ---- Gathering ---------------------------------------------------------
  - name: collection_drop_rate
    group: Gathering
    type: number
    label: Gathered item yield
    description: >-
      Gatherable items multiplier. Config key: CollectionDropRate.
    min: 0.1
    max: 10.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: collection_object_hp_rate
    group: Gathering
    type: number
    label: Gatherable health
    description: >-
      Gatherable objects health multiplier. Config key: CollectionObjectHpRate.
    min: 0.1
    max: 10.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: collection_object_respawn_speed_rate
    group: Gathering
    type: number
    label: Gatherable respawn
    description: >-
      Gatherable objects respawn interval multiplier. Config key:
      CollectionObjectRespawnSpeedRate.
    min: 0.1
    max: 10.0
    step: 0.1
    default: "1.0"
    editable: true
  - name: enemy_drop_item_rate
    group: Gathering
    type: number
    label: Enemy drop quantity
    description: >-
      Dropped item quantity multiplier. Config key: EnemyDropItemRate.
    min: 0.1
    max: 10.0
    step: 0.1
    default: "1.0"
    editable: true

  # ---- Death and respawn -------------------------------------------------
  - name: death_penalty
    group: Death and respawn
    type: select
    label: Death penalty
    description: >-
      What is dropped on death. Config key: DeathPenalty.
    default: "Item"
    options:
      - { value: "None", label: "Nothing" }
      - { value: "Item", label: "All items except equipment" }
      - { value: "ItemAndEquipment", label: "All items" }
      - { value: "All", label: "All items and Pals on team" }
    editable: true
  - name: hardcore
    group: Death and respawn
    type: bool
    true_value: "True"
    false_value: "False"
    label: Hardcore
    description: >-
      Enable Hardcore. Players cannot respawn on death. Config key: bHardcore.
    default: "False"
    editable: true
  - name: pal_lost
    group: Death and respawn
    type: bool
    true_value: "True"
    false_value: "False"
    label: Lose Pals on death
    description: >-
      Permanently lose Pals on death. Config key: bPalLost.
