id: the-isle
schema: 3
name: The Isle (Evrima)
description: >
  Afterthought's open-world dinosaur survival game, played as a dinosaur. Runs
  the Evrima dedicated server.
version: "1.0.0"

branding:
  steam_app_id: 376210
  icon: icon.jpg
  logo: logo.png
  banner: banner.jpg

architectures: [amd64]

# 412680 (The Isle Dedicated Server) has a native Linux build on its "evrima"
# branch; installs anonymously.
install:
  shared: true
  mount: { path: /game, mode: ro }
  image: { base: steamcmd }
  steps:
    - op: steamcmd
      app_id: 412680
      beta: evrima

server:
  writable_paths:
    # Config (Game.ini), logs and PlayerData/ (the player database).
    - { from: saved, to: /game/TheIsle/Saved }
    - { from: home, to: /home/steam }

containers:
  - role: game
    primary: true
    image: { base: steamcmd }
    # The server lists through Epic Online Services and needs the game's
    # dedicated-server EOS client credentials; these are the ones the
    # pelican-eggs egg passes, the same way. Without "TheIsle" as the first
    # argument and a MapName in Game.ini it loops on the title map
    # ("Invalid URL"). Unreal refuses root; YGG_DROP_PRIVS runs it as the
    # agent's uid. Verified on inari.
    command: >-
      stdbuf -oL -eL /game/TheIsle/Binaries/Linux/TheIsleServer-Linux-Shipping TheIsle
      -Port={{.Ports.game}}
      -ini:Engine:[EpicOnlineServices]:DedicatedServerClientId=xyza7891gk5PRo3J7G9puCJGFJjmEguW
      -ini:Engine:[EpicOnlineServices]:DedicatedServerClientSecret=pKWl6t5i9NJK8gTpVlAxzENZ65P8hYzodV8Dqe5Rlc8
    workdir: /game
    env:
      HOME: /home/steam
      YGG_DROP_PRIVS: "1"
      YGG_CHOWN_DIRS: /game/TheIsle/Saved
      LD_LIBRARY_PATH: /game/linux64
    ports:
      # Verified live: the game port is UDP and the only one bound by default.
      - { name: game, protocol: udp, default: 7777, kind: game }
      # Bound only while RCON is enabled below.
      - { name: rcon, protocol: tcp, default: 8888, kind: rcon }

config:
  files:
    - path: saved/Config/LinuxServer/Game.ini
      parser: ini
      manage: patch
      importable: true
      set:
        /Script/TheIsle.TIGameSession/RconPort: "{{.Ports.rcon}}"
        /Script/TheIsle.TIGameSession/bQueueEnabled: "false"

# Copied from a real boot (0.22.157, inari, 2026-11-24): about four seconds,
# once the map named in Game.ini has loaded.
ready:
  mode: log
  pattern: 'Load map complete /Game/TheIsle/Maps/Game/'
  timeout: 600s

# The egg stops it with ^C. Verified live: SIGINT exits within two seconds
# ("LogExit: Exiting.") and checkpoints the player database.
stop:
  timeout: 30s
  then: SIGINT

logs:
  values:
    - { name: game_version, label: "Game version", version: true, pattern: 'Set ProjectVersion to ([0-9][0-9.]*[0-9])' }

connect:
  label: "Direct connect"
  copy: "{{.Endpoint.game}}"

backup:
  include: [saved]

groups:
  - name: Server
  - name: Gameplay
  - name: Remote access
    collapsed: true

settings:
  - { name: server_name, group: Server, label: Server name, default: The Isle Server, to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameSession/ServerName } }
  - name: max_players
    group: Server
    type: number
    label: Max players
    min: 1
    max: 200
    step: 1
    default: "100"
    to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameSession/MaxPlayerCount }
  - { name: use_password, group: Server, type: bool, label: Require a password, true_value: "true", false_value: "false", default: "false", to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameSession/bServerPassword } }
  - { name: password, group: Server, type: password, label: Password, default: "", to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameSession/ServerPassword } }
  - name: admins
    group: Server
    label: Admin Steam IDs
    description: Comma-separated SteamID64s.
    default: ""
    to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameStateBase/AdminsSteamIDs }
  - name: map
    group: Gameplay
    type: combo
    label: Map
    options:
      - { value: Gateway, label: Gateway }
    default: Gateway
    to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameSession/MapName }
  - { name: dynamic_weather, group: Gameplay, type: bool, label: Dynamic weather, true_value: "true", false_value: "false", default: "true", to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameSession/bServerDynamicWeather } }
  - { name: humans, group: Gameplay, type: bool, label: Allow humans, true_value: "true", false_value: "false", default: "false", to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameSession/bEnableHumans } }
  - { name: rcon_enabled, group: Remote access, type: bool, label: Enable RCON, true_value: "true", false_value: "false", default: "false", to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameSession/bRconEnabled } }
  - { name: rcon_password, group: Remote access, type: password, label: RCON password, default: "", to: { file: saved/Config/LinuxServer/Game.ini, key: /Script/TheIsle.TIGameSession/RconPassword } }
