      cannot express — leave blank to run none.
    default: ""
    editable: true

  # ---- World ----------------------------------------------------------------
  # WorldConfig's own top-level fields, as against the WorldConfiguration bag
  # below it that the World Configuration wiki page documents.
  - name: world_name
    group: World
    label: World name
    description: >-
      A world with this name is created if it does not exist; an existing
      name loads that world. Also names the save file
      (/data/Saves/<world name>.vcdbs), so renaming this starts a new world
      rather than renaming the current one.
    default: "Yggdrasil World"
    editable: true
  - name: world_seed
    group: World
    label: World seed
    description: Leave blank for a random seed. Only used the first time a world is created.
    default: ""
    editable: true
  - name: play_style
    group: World
    type: select
    label: Play style
    description: >-
      Picks the preset a new world is created from. It does not re-apply to a
      world that already exists.
    default: "surviveandbuild"
    editable: true
    options:
      - { value: "surviveandbuild",    label: "Surviving and building — the default balance" }
      - { value: "wildernesssurvival", label: "Wilderness survival — no trader waypoints, harder start" }
      - { value: "exploration",        label: "Exploration" }
      - { value: "homosapiens",        label: "Homo Sapiens — expedition-style, permadeath" }
      - { value: "creativebuilding",   label: "Creative building — flight and unlimited resources" }
