id: ark-survival-ascended
schema: 3
name: ARK Survival Ascended
icon: "🦖"
description: >
  Dedicated server for ARK Survival Ascended. Several maps can share one copy
  of the game files and a cluster volume, so players keep their characters and
  items when they travel between maps.
version: "5.2.0"

# The bundled target is the x86_64 Windows dedicated server, run under
# Proton. The architecture here is the *node's*, not the binary's.
architectures: [amd64]

install:
  shared: true
  mount: { path: /game, mode: ro }
  # A steamcmd step runs in a container rather than on the node host, so the
  # seed names which one (ADR-057). This is the image the agent was already
  # using by default; naming it makes what runs visible here instead of in a
  # constant inside the installer.
  image: { base: steamcmd }
  steps:
    - op: steamcmd
      app_id: 2430930

server:
  writable_paths:
    - { from: saved, to: /game/ShooterGame/Saved }
    - { from: config, to: /game/ShooterGame/Saved/Config }
    # ARK's bundled CurseForge mod client writes here, inside the install
    # rather than under Saved, and the install is mounted read-only. Without
    # this the server initialises, prints its version, and then stops dead:
    #
    #     LogCFCore: Error: Unable to create a directory
    #       .../ShooterGame/Binaries/Win64/ShooterGame/ModsUserData/83374
    #
    # and the log never advances again. Nothing says "crashed" -- the container
    # keeps running and the readiness timeout eventually reports it up anyway,
    # which is how this went unnoticed. Mounting a per-server directory over it
    # lets the client write and start.
    - { from: mods, to: /game/ShooterGame/Binaries/Win64/ShooterGame/ModsUserData }
    # HOME for the container's steam user. Everything Proton keeps per
    # server lives under here — the Wine prefix (compatdata), the native
    # steamclient.so ygg-proton stages into .steam/sdk64, and Proton's own
    # scratch state — so it must be per-server and writable, never part of
    # the shared read-only install (ADR-018).
    - { from: home, to: /home/steam }

cluster:
  supported: true
  mount: /cluster
  args: ["-clusterid={{.ClusterID}}", "-ClusterDirOverride=/cluster"]

containers:
  - role: game
    primary: true
    # base-steamcmd-proton, not a dedicated yggdrasil/ark-asa image: nothing
    # ARK-specific is baked in, so the same image serves any Steam-distributed
    # Windows-only dedicated server.
    #
    # Named symbolically rather than pinned to a literal
    # ghcr.io/arasoi/base-steamcmd-proton:release-latest, which is what this was.
    # release-latest is built only from main, so a fix on develop could not reach
    # a node at all -- and one had to: a stale X lock left Xvfb unable to start,
    # so every restart of a crashed container failed before the game launched.
    # The symbolic form resolves against whichever channel the control plane
    # itself follows, which is the whole reason it exists.
    image: { base: steamcmd-proton }
    # ygg-proton handles the Proton invocation details that are easy to get
    # wrong and fail obscurely (prefix directory creation, the native
    # steamclient.so staging, absolute-path resolution, and using
    # waitforexitandrun so the container does not exit while the game is
    # still starting). See that script for why each step exists.
    # Wrapped in a shell for one reason: ARK writes nothing to stdout.
    #
    # Everything it logs goes to ShooterGame.log under Saved, so the console
    # showed only Proton's own startup and stayed empty for the life of the
    # server -- and readiness, which matches on what the container prints, could
    # never see "has successfully started!" no matter how correct the pattern
    # was. The server reached that line and sat in `starting` until the 900s
    # timeout reported it up anyway.
    #
    # tail -F rather than -f: the file does not exist yet at this point, and ARK
    # rotates the previous run's log out from under it on start. Following by
    # name survives both. It is a background child, so the container still exits
    # when the server does.
    #
    # This is what the community's own ARK containers do; no flag makes the
    # engine print to stdout under Proton.
    command: >-
      sh -c 'mkdir -p /game/ShooterGame/Saved/Logs;
      tail -F -n +1 /game/ShooterGame/Saved/Logs/ShooterGame.log 2>/dev/null &
      exec ygg-proton ./ShooterGame/Binaries/Win64/ArkAscendedServer.exe {{.Vars.map}}?listen?SessionName={{.Vars.session_name}}?Port={{.Ports.game}}?QueryPort={{.Ports.query}}?RCONPort={{.Ports.rcon}}?RCONEnabled=True?ServerAdminPassword={{.Vars.admin_password}}?MaxPlayers={{.Vars.max_players}} -WinLiveMaxPlayers={{.Vars.max_players}} -oldconsole -servergamelog -NoBattlEye -Port={{.Ports.game}}'
    workdir: /game
    env:
      HOME: /home/steam
      # The image always takes ownership of HOME; these are the seed's own
      # writable mounts that also have to belong to the container's user.
      # Unreal fails softly without it — unable to create ShooterGame.log it
      # falls back to Wine's stubbed Windows event log and dies with nothing
      # to read (ADR-047).
      YGG_PROTON_CHOWN_DIRS: "/game/ShooterGame/Saved /cluster"
      # Must end in the Steam app id — Proton's protonfixes parses it back
      # out of this path with a regex.
      STEAM_COMPAT_DATA_PATH: /home/steam/compatdata/2430930
      STEAM_COMPAT_CLIENT_INSTALL_PATH: /home/steam/steam
      # Without this ARK crashes instantly in VKD3D-Proton's D3D12 path
      # (dxgi -> d3d12core -> d3d12, null-pointer access violation), which
      # passing -nullrhi does not prevent. Forcing Wine's own D3D
      # implementation avoids it. Confirmed against the real binary.
      PROTON_USE_WINED3D: "1"
      # ARK's depot ships its own Windows steamclient64.dll, and the
      # Windows DLL search order prefers the application directory, so that
      # native copy wins over anything Proton stages into the prefix. It
      # then blocks forever waiting for a Steam client that does not exist
      # — the server reached exactly this point and hung indefinitely,
      # with or without network access. Forcing the builtin makes the load
      # fail fast instead, and the server boots.
      #
      # The cost is real and not yet fully assessed: the server logs
      # "Steam Subsystem initialized: FAILED". ARK ASA lists servers
      # through Epic Online Services rather than the Steam master server,
      # so this is expected not to prevent players joining — but that has
      # NOT been verified with a real game client. Revisit before treating
      # this seed as production-ready.
      WINEDLLOVERRIDES: "steamclient64=b;steamclient=b"
    ports:
      - { name: game, protocol: udp, default: 7777 }
      # ARK binds a second UDP socket at game+1, its raw/reliable channel, and
      # derives that number from Port itself: there is no argument or ini key
      # for it, which is why nothing below references this port. Declared all
      # the same, because a port the game binds and the control plane does not
      # know about is one it will hand to another server.
      #
      # That is not hypothetical. It was found on a live fleet: an ARK map on
      # game 4001 needed 4002, and 4002 had been allocated to an unrelated
      # server -- silently, because neither side ever said it wanted it.
      #
      # offset_from is what makes the pair atomic (ADR-083): a base candidate
      # is only accepted once game+1 is confirmed free too, so the two move
      # together instead of one being claimed without the other.
      - { name: game_raw, protocol: udp, offset_from: game, offset: 1 }
      # Independent, unlike game_raw: ARK takes ?QueryPort= and will bind
      # whatever it is given, so this does not have to sit next to the game
      # port -- and must not be assumed to, which is how it ended up on game+1
      # and collided with the raw socket on a freshly created server.
      - { name: query, protocol: udp, default: 27015 }
      - { name: rcon, protocol: tcp, default: 27020 }

variables:
  # ASA's maps carry a "_WP" suffix (Unreal Engine 5 World Partition).
  # Plain "TheIsland" is the ASE name and does not exist in ASA's install.
  - { name: map, default: TheIsland_WP, editable: true }
  - { name: session_name, default: YggdrasilARK, editable: true }
  - { name: max_players, default: "70", editable: true }
  # RCON only actually binds its port when an admin password is set —
  # verified live: without this the server starts normally but nothing
  # listens on the RCON port at all. Change it before exposing a server;
  # it is also the in-game EnableCheats password.
  - { name: admin_password, default: changeme, editable: true }

# Groups exist to give the settings below a shape. The server page renders a
# section of four or more groups as a tab rail with a filter over the whole
# page (ADR-085), which is what makes a surface this size navigable at all —
# before this seed had groups it was four controls in one undifferentiated
# stack.
groups:
  - name: Server
    description: Identity, passwords, and how often the world is written to disk.
  - name: Rules and access
    description: What the client is allowed to show and do.
    collapsed: true
  - name: "Rates: experience"
    collapsed: true
  - name: "Rates: harvesting"
    collapsed: true
  - name: "Rates: taming"
    collapsed: true
  - name: Players
    description: Survivor stats, drain rates, and crafting.
    collapsed: true
  - name: Dinos
    description: Wild and tamed creature stats, limits, and decay.
    collapsed: true
  - name: Breeding and imprinting
    collapsed: true
  - name: Structures
    collapsed: true
  - name: PvP and raiding
    collapsed: true
  - name: Tribes
    collapsed: true
  - name: World and time
    collapsed: true
  - name: Cluster transfers
    description: >-
      What may cross between servers sharing this cluster. Only meaningful on a
      server that is in one.
    collapsed: true
  - name: Advanced
    description: >-
      Engine-level and rarely-touched keys. Every one of these has a default the
      game itself supplies, so leaving them alone is the ordinary case.
    collapsed: true

# ARK's own configuration, written into GameUserSettings.ini and Game.ini.
#
# WHY THESE ARE SETTINGS AND NOT VARIABLES: a variable reaches the command line
# and rebuilds the pod; a setting declares where its value lands (ADR-077). All
# of these are ini keys, so they are settings, and the four variables above stay
# variables because they are genuinely command-line arguments.
#
# DELIBERATELY ABSENT: SessionName, MaxPlayers, ServerAdminPassword, RCONEnabled,
# RCONPort, Port and QueryPort. Every one of them is already passed on the
# command line above, where ARK gives it precedence over the ini, so declaring
# both would create two writers for one value and a precedence rule an operator
# would have to know. The command line wins; these are not offered twice.
#
# EVERY ONE OF THESE IS `optional: true`, and that is load-bearing rather than
# tidy. An absent optional setting leaves its destination alone entirely — the
# key is not written at all (ADR-077's tri-state). So:
#
#   * A server that already exists does not have 167 keys patched over its ini
#     the next time anything rebuilds its pod. Before this release the seed
#     wrote no config files whatsoever, so an operator's hand-edited
#     GameUserSettings.ini is the ordinary case, not the exception, and
#     silently overwriting it on an unrelated port change would be the worst
#     thing this release could do.
#   * A brand-new server gets ARK's own defaults, exactly as it did before,
#     because nothing here is written until an operator asks for it.
#
# The protection is real but it is not permanent: the settings form renders
# every control, so the first save makes every setting present and writes it.
# That is an explicit action rather than a side effect, which is the whole
# distinction being preserved. An operator with an ini they care about should
# use "Import from disk" on the settings page first — both files below are
# marked importable for exactly this — which reads their values back and adopts
# them, so the first save writes what they already had.
#
# NOT VERIFIED AGAINST A RUNNING SERVER. The key names, sections and defaults
# here come from Wildcard's published server configuration documentation, not
# from a live ARK server — phase 5's exit criterion is still open and this seed
# has never run end to end through yggd (ADR-047's final amendment). What that
# means in practice: a key whose spelling is wrong is *silently ignored* by
# Unreal rather than rejected, so a setting that appears to save and does
# nothing is the failure mode to expect here. Treat a value that seems not to
# take effect as a seed bug worth reporting, not as an operator error.
settings:
  # ---- Server ------------------------------------------------------------
  - name: server_password
    group: Server
    type: password
    label: Join password
    description: Required to connect. Blank leaves the server open.
    default: ""
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/ServerPassword }
  - name: spectator_password
    group: Server
    type: password
    label: Spectator password
    description: Lets a non-admin enter spectator mode with /spectator.
    default: ""
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/SpectatorPassword }
  - name: server_pve
    group: Server
    type: bool
    label: PvE mode
    description: Players cannot damage each other or each other's structures.
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/ServerPVE }
  - name: server_hardcore
    group: Server
    type: bool
    label: Hardcore
    description: Death resets the survivor to level 1.
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/ServerHardcore }
  - name: difficulty_offset
    group: Server
    type: number
    label: Difficulty offset
    description: >-
      0 to 1, scaling wild creature levels. Use with "Override official
      difficulty" below, which is what actually sets the level cap.
    min: 0
    max: 1
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/DifficultyOffset }
  - name: override_official_difficulty
    group: Server
    type: number
    label: Override official difficulty
    description: >-
      Max wild level is this times 30. 5.0 gives level 150 wilds, the official
      value; 1.0 gives level 30.
    min: 0
    step: 0.001
    default: "5.0"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/OverrideOfficialDifficulty }
  - name: auto_save_period_minutes
    group: Server
    type: number
    label: Autosave interval (minutes)
    description: How often the world is written to disk. Saving briefly stalls the server.
    min: 1
    max: 240
    step: 1
    default: "15"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/AutoSavePeriodMinutes }
  - name: kick_idle_players_period
    group: Server
    type: number
    label: Kick idle after (seconds)
    description: 0 never kicks.
    min: 0
    step: 1
    default: "3600"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/KickIdlePlayersPeriod }
  - name: motd
    group: Server
    label: Message of the day
    description: Shown to a player as they join.
    default: ""
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: MessageOfTheDay/Message }
  - name: motd_duration
    group: Server
    type: number
    label: Message of the day duration (seconds)
    min: 1
    max: 120
    step: 1
    default: "20"
    show_if: { name: motd, not_equals: "" }
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: MessageOfTheDay/Duration }
  - name: ban_list_url
    group: Server
    label: Ban list URL
    description: A shared ban list this server honours. Blank uses only the local one.
    default: ""
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/BanListURL }
  - name: global_voice_chat
    group: Server
    type: bool
    label: Global voice chat
    description: Voice reaches the whole server rather than only nearby players.
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/GlobalVoiceChat }
  - name: proximity_chat
    group: Server
    type: bool
    label: Proximity text chat
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/ProximityChat }
  - name: always_notify_player_joined
    group: Server
    type: bool
    label: Announce joins
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/AlwaysNotifyPlayerJoined }
  - name: always_notify_player_left
    group: Server
    type: bool
    label: Announce leaves
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/AlwaysNotifyPlayerLeft }

  # ---- Rules and access --------------------------------------------------
  - name: allow_third_person
    group: Rules and access
    type: bool
    label: Allow third person
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/AllowThirdPersonPlayer }
  - name: server_crosshair
    group: Rules and access
    type: bool
    label: Crosshair
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/ServerCrosshair }
  - name: server_force_no_hud
    group: Rules and access
    type: bool
    label: Force HUD off
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/ServerForceNoHUD }
  - name: show_map_player_location
    group: Rules and access
    type: bool
    label: Show own position on the map
    description: Off means a player has to work out where they are.
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/ShowMapPlayerLocation }
  - name: show_floating_damage_text
    group: Rules and access
    type: bool
    label: Floating damage numbers
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/ShowFloatingDamageText }
  - name: allow_hit_markers
    group: Rules and access
    type: bool
    label: Hit markers
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/AllowHitMarkers }
  - name: enable_pvp_gamma
    group: Rules and access
    type: bool
    label: Allow gamma adjustment in PvP
    description: On lets a player brighten their own night, which is usually the point of turning it off.
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/EnablePvPGamma }
  - name: disable_pve_gamma
    group: Rules and access
    type: bool
    label: Block gamma adjustment in PvE
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/DisablePvEGamma }
  - name: use_corpse_locator
    group: Rules and access
    type: bool
    label: Corpse locator beam
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/UseCorpseLocator }
  - name: prevent_spawn_animations
    group: Rules and access
    type: bool
    label: Skip spawn animation
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/PreventSpawnAnimations }
  - name: prevent_diseases
    group: Rules and access
    type: bool
    label: Disable diseases
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/PreventDiseases }
  - name: non_permanent_diseases
    group: Rules and access
    type: bool
    label: Diseases are curable
    description: A disease is lost on respawn rather than kept for the character's life.
    true_value: "True"
    false_value: "False"
    default: "False"
    show_if: { name: prevent_diseases, equals: "False" }
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/NonPermanentDiseases }
  - name: allow_hide_damage_source_from_logs
    group: Rules and access
    type: bool
    label: Hide damage source in the tribe log
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/AllowHideDamageSourceFromLogs }

  # ---- Rates: experience -------------------------------------------------
  - name: xp_multiplier
    group: "Rates: experience"
    type: number
    label: Experience multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/XPMultiplier }
  - name: kill_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Kill XP multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/KillXPMultiplier }
  - name: harvest_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Harvest XP multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/HarvestXPMultiplier }
  - name: craft_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Craft XP multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/CraftXPMultiplier }
  - name: generic_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Generic XP multiplier
    description: Passive experience, earned just for being alive.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/GenericXPMultiplier }
  - name: special_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Special event XP multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/SpecialXPMultiplier }

  # ---- Rates: harvesting -------------------------------------------------
  - name: harvest_amount_multiplier
    group: "Rates: harvesting"
    type: number
    label: Harvest amount multiplier
    description: How much a single harvest yields.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/HarvestAmountMultiplier }
  - name: harvest_health_multiplier
    group: "Rates: harvesting"
    type: number
    label: Resource health multiplier
    description: How much punishment a tree or rock takes before it is used up.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/HarvestHealthMultiplier }
  - name: resources_respawn_period_multiplier
    group: "Rates: harvesting"
    type: number
    label: Resource respawn period multiplier
    description: Lower is faster. This one is inverted relative to the others here.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/ResourcesRespawnPeriodMultiplier }
  - name: player_harvesting_damage_multiplier
    group: "Rates: harvesting"
    type: number
    label: Player harvesting damage multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/PlayerHarvestingDamageMultiplier }
  - name: dino_harvesting_damage_multiplier
    group: "Rates: harvesting"
    type: number
    label: Creature harvesting damage multiplier
    min: 0
    step: 0.001
    default: "3.2"
    optional: true
    to: { file: config/WindowsServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/DinoHarvestingDamageMultiplier }
  - name: supply_crate_loot_quality_multiplier
    group: "Rates: harvesting"
    type: number
    label: Supply crate loot quality multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/WindowsServer/GameUserSettings.ini, key: ServerSettings/SupplyCrateLootQualityMultiplier }
  - name: crop_growth_speed_multiplier
    group: "Rates: harvesting"
    type: number
    label: Crop growth speed multiplier
