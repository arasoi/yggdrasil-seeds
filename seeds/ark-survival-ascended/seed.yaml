# ARK's own ini files, patched rather than rewritten.
#
# `patch` is the only mode that is safe here, and the reason is worth stating.
# ARK writes both of these itself — GameUserSettings.ini on first run and again
# on shutdown, adding any key it did not find — so a mode that rewrote the file
# wholesale (`always`) would throw away everything the game had added, and
# `once` would mean no setting here ever reached a server that had already
# started. `patch` sets the keys this seed names and leaves every other line,
# comment and section exactly as it found it (ADR-077).
#
# On a brand-new server the file does not exist yet, so the first patch writes
# only the keys named above. That is safe for Unreal in a way it was NOT for
# Vintage Story's JSON (ADR-084): Unreal resolves a missing ini key to that
# property's compiled default, key by key, so an absent key means "use the
# game's own default" rather than "this collection is empty". The failure that
# decision records — a scalar default pointing into a list nothing populated —
# has no equivalent in a flat ini of scalars.
#
# Both are marked importable, which is the migration path for a server somebody
# already configured by hand: read the file back off the node and adopt the
# values this seed recognises, rather than having the next rebuild quietly
# patch over them.
config:
  files:
    - path: config/WindowsServer/GameUserSettings.ini
      parser: ini
      manage: patch
      importable: true
    - path: config/WindowsServer/Game.ini
      parser: ini
      manage: patch
      importable: true

# Readiness is a declared mode now, not a substring, and the pattern is a Go
# regular expression. This one is verified verbatim against a live server:
#   Server: "Yggdrasil ARK" has successfully started!
# An earlier rule ("Server has completed startup") never matched — it was
# written from the schema sketch rather than from real output.
#
# The timeout is generous because ARK genuinely is: a real depot boots in about
# 18 seconds once installed, but a cold Wine prefix takes considerably longer.
# on_timeout defaults to reporting running anyway with a reason, so a pattern
# that stops matching after a game update delays this server rather than
# stranding it.
ready:
  mode: log
  pattern: "has successfully started!"
  timeout: 900s

# No crash block, and the candidate stays a comment: `crash: {mode: log}` is
# implemented now, and a match KILLS THE POD so the ordinary exit path can restart
# it. That raises the bar well above readiness's -- a wrong readiness pattern
# delays a server, a wrong crash pattern stops a healthy one -- and "Fatal error"
# has never been checked against a running ARK server for how often it appears
# without being terminal.
#
# Worth noting what this would and would not have caught: ADR-047's Crashpad hang,
# the failure that motivates the whole mode, printed no distinctive line at all. So
# even a verified pattern here is not the fix for that; a readiness timeout is.
#
# crash:
#   mode: log
#   pattern: "Fatal error"

backup:
  include: [saved, config]
