id: dune-awakening
schema: 3
name: Dune Awakening
description: >
  Funcom's official self-hosted "battlegroup" server for Dune: Awakening --
  a survival MMO. Unlike every other multi-container seed in this catalog,
  every service here (the map server, the client gateway, the map-lifecycle
  director, chat routing, PostgreSQL and two RabbitMQ brokers) ships as
  Funcom's own pre-built container image inside the SteamCMD-downloaded
  self-host package, rather than as raw game files this seed installs into
  one container. Built to match Funcom's own setup (scripts/setup in the
  depot), which runs the same images under Kubernetes operators; see the
  block comment above `containers:`.
version: "0.6.1"

branding:
  # The base game's own Steam app id, for branding only -- distinct from the
  # dedicated-server tool's own app id (4754530) used by the steamcmd install
  # step below, which has no public store page or artwork of its own.
  steam_app_id: 1172710
  icon: icon.jpg
  logo: logo.png
  banner: banner.jpg

# Confirmed live (2026-08, community reporting): the actual server binaries
# are native Linux, run directly in Docker with no Windows/Hyper-V/VM layer
# and no Proton -- both CubeCoders AMP's 2026-08 release and an independent
# community Docker-Compose project (snapetech/DuneAwakeningSelfHost, "DASH")
# run it this way. Funcom's own official guide is still Windows+Hyper-V+VM
# based, but that is a packaging choice on Funcom's part, not evidence the
# binaries need it. AVX2 is a stated hardware requirement; arm64 is not
# claimed anywhere and RabbitMQ/steamcmd's own toolchain make it unlikely.
architectures: [amd64]

# The dedicated-server tool's own Steam app id (confirmed via the official
# self-hosting help center and independently via a community Docker project's
# own scripts). 3104830 is the PTC (test) build's app id, kept here as a
# comment rather than a second field this format has no place for:
#   PTC app id: 3104830
install:
  shared: true
  mount: { path: /game, mode: ro }
  image: { base: steamcmd }
  steps:
    - op: steamcmd
      app_id: 4754530
      name: "Dune Awakening self-hosted server package"
    # Seven load_image steps, one per real docker-save tarball the depot
    # ships under images/ -- confirmed live: `podman load -i` on each of
    # these exact paths, against a real pull of this exact app id, reported
    # the exact registry.funcom.com refs every container below now declares
    # `loaded: true` against (yggdrasil ADR-155). server-rabbitmq.tar is
    # loaded once and shared by both admin-rmq and game-rmq -- loading is a
    # node-local image-store operation, not a per-container one, so a second
    # container referencing the same ref needs no second step.
    # The battlegroup images' tag follows Funcom's build: Steam build
    # 26591491 ships them as 2181988-0-shipping (read back with `docker
    # images` on a node after a real install, 2026-11-28), where the build
    # this seed was first written against shipped 2064155-0-shipping. A load
    # step loads whatever tag the tarball carries, so when Funcom updates the
    # depot, every `ref:` below must move with it or provisioning fails with
    # "not present locally". igw-postgres keeps its own pinned tag.
    - op: load_image
      from: images/prerequisites/igw-postgres.tar
      name: "PostgreSQL image (igw-postgres)"
    - op: load_image
      from: images/battlegroup/server-rabbitmq.tar
      name: "RabbitMQ image (shared by admin-rmq and game-rmq)"
    - op: load_image
      from: images/battlegroup/server-gateway.tar
      name: "Gateway image"
    - op: load_image
      from: images/battlegroup/server-bg-director.tar
      name: "Battlegroup director image"
    - op: load_image
      from: images/battlegroup/server-text-router.tar
      name: "Text router image"
    - op: load_image
      from: images/battlegroup/server.tar
      name: "Map server image (shared by game, overmap, arrakeen)"
    - op: load_image
      from: images/battlegroup/server-db-utils.tar
      name: "Database schema tool image (db-init)"
    # dune-admin is a companion operator dashboard (github.com/Icehunter/dune-admin),
    # not part of Funcom's own distribution. It has no published container
    # image, but ships as a static, dependency-free Go binary via GitHub
    # Releases, so it is fetched and extracted the same way FiveM's own
    # FXServer artifact is -- alongside the game files, since this format has
    # no second install mechanism for a companion tool. Pinned to a specific
    # verified release rather than "latest", matching every other pinned
    # download in this catalog.
    - op: download
      url: "https://github.com/Icehunter/dune-admin/releases/download/v0.48.2/dune-admin_linux_amd64.tar.gz"
      into: dune-admin.tar.gz
      name: "Director panel (dune-admin)"
    - op: extract
      from: dune-admin.tar.gz
      archive: targz
      strip_components: 0

server:
  writable_paths:
    # The primary map server's own save data. Path confirmed from a real
    # community Docker Compose project's own bind mount
    # (.../DuneSandbox/Saved) -- not yet confirmed against this seed's own
    # SteamCMD-downloaded layout, since that has not been inspected directly.
    - { from: saved, to: /home/dune/server/DuneSandbox/Saved }

# ---------------------------------------------------------------------------
# HOW THIS SEED MIRRORS FUNCOM'S OWN SETUP
#
# The depot (app 4754530) ships every service as a `docker save` tarball under
# images/, loaded by the load_image steps above, plus Funcom's own setup under
# scripts/. Funcom's setup.sh installs k3s and four Kubernetes operators;
# scripts/setup/world.sh then fills scripts/setup/templates/world-template.yaml
# (a BattleGroup resource) and the operators turn it into these containers.
# Yggdrasil runs the containers itself, so this seed does what the template
# and the operators do:
#
#   - battlegroup name: world.sh's sh-<token HostId, lowercase>-<6 random a-z>.
#     Derived here from the token, the suffix from the server id mapped onto
#     letters; FLS refuses a suffix with a digit (seen live).
#   - region: world.sh offers Asia, Europe, North America, Oceania, South
#     America; it goes to -FarmRegion and BATTLEGROUP_REGION_NAME.
#   - world partitions: the template's worldPartitions list, which Funcom's
#     database operator writes into world_partition. The partitions container
#     reads it from the installed template on every start.
#   - message queues: the template's admin and game MessageQueue configs, the
#     game one TLS only, both authenticating logins against the text router.
#   - director.ini: copied from the template; the partitions step warns in
#     its log when Funcom's copy changes.
#   - the authorization preset BattlegroupInternal on every service, and the
#     gateway's public broker address (the operator's "Public" queue mode).
#
# Image tags are pinned to the build the depot shipped (images/battlegroup/
# version.txt: 2181988). A depot update that changes them needs this seed's
# refs moved with it, or provisioning fails with "not present locally".
# ---------------------------------------------------------------------------

containers:
  # --- Infrastructure: PostgreSQL and the two RabbitMQ brokers ------------

  - role: postgres
    image: { ref: "registry.funcom.com/funcom/self-hosting/igw-postgres:17.4-alpine-fc-13", loaded: true }
    # This image is confirmed live to be the stock, unmodified official
    # PostgreSQL Docker entrypoint (docker-entrypoint.sh, no custom
    # /docker-entrypoint-initdb.d scripts) -- not a Funcom-patched one. A
    # previous version of this seed carried a second env var here,
    # POSTGRES_SUPER_PASSWORD, marked "purpose not yet confirmed"; grepping
    # the real image for any handling of it found none. The stock entrypoint
    # creates exactly one role from POSTGRES_USER/POSTGRES_PASSWORD, and
    # that role is already a superuser (stock behaviour, whatever it is
    # named) -- there is no second admin role for a second credential to
    # belong to. Removed rather than kept "just in case": carrying a field
    # the real image provably never reads is worse than not declaring it.
    env:
      POSTGRES_DB: dune
      POSTGRES_USER: dune
      POSTGRES_PASSWORD: "{{.Vars.db_password}}"
    volumes:
      - { from: pgdata, to: /var/lib/postgresql/data }
    healthcheck:
      command: "pg_isready -U dune -d dune"
      interval: 10s
      timeout: 5s
      retries: 12
    # The data directory is archived while Postgres runs, so its files are
    # tarred mid-write; this dump beside them is the consistent copy to
    # restore from. It goes inside the volume because volumes are what the
    # archive carries, and over the local socket, which the stock entrypoint
    # trusts. Not yet run against a provisioned server.
    backup:
      pre: "pg_dump -U dune -Fc dune > /var/lib/postgresql/data/ygg-backup-dune.dump"
      post: "rm -f /var/lib/postgresql/data/ygg-backup-dune.dump"
    # Yggdrasil's built-in database tool signs in with this, through the
    # node's agent, giving the server a Database tab with no admin add-on and
    # no published database port. The dune role is the stock entrypoint's
    # one role and already a superuser (see above). Replaces the CloudBeaver
    # add-on this seed shipped until 0.4.0. Not yet run against a real
    # provision of this seed.
    database:
      engine: postgres
      user: dune
      password: "{{.Vars.db_password}}"
      name: dune

  - role: admin-rmq
    name: Admin RabbitMQ
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server-rabbitmq:2181988-0-shipping", loaded: true }
    env:
      RMQ_AUTH_BACKEND_1: cache
      RMQ_HTTP_TOKEN_AUTH_SECRET: "{{.Vars.rmq_secret}}"
      FuncomLiveServices__RmqTlsEnabled: "false"
    # Funcom's MessageQueue config (configs/rabbitmq-*.conf, written by
    # config.files below) is copied into the image's own conf.d as root
    # before the image's entrypoint drops to the rabbitmq user: the agent
    # writes the file readable by root alone. sh as the first word keeps
    # docker-entrypoint.sh from dropping privileges until the exec.
    command: >-
      sh -c 'cp /ygg/ygg.conf /etc/rabbitmq/conf.d/90-ygg.conf &&
      cp /ygg/enabled_plugins /etc/rabbitmq/enabled_plugins &&
      chmod 644 /etc/rabbitmq/conf.d/90-ygg.conf /etc/rabbitmq/enabled_plugins &&
      exec docker-entrypoint.sh rabbitmq-server'
    volumes:
      - { from: data, to: /var/lib/rabbitmq }
      - { from: ygg, to: /ygg }
    healthcheck:
      command: "rabbitmq-diagnostics -q check_running"
      interval: 10s
      timeout: 5s
      retries: 12

  - role: game-rmq
    name: Game RabbitMQ
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server-rabbitmq:2181988-0-shipping", loaded: true }
    env:
      RMQ_AUTH_BACKEND_1: cache
      RMQ_HTTP_TOKEN_AUTH_SECRET: "{{.Vars.rmq_secret}}"
      FuncomLiveServices__RmqTlsEnabled: "true"
    # Funcom's MessageQueue config (configs/rabbitmq-*.conf, written by
    # config.files below) is copied into the image's own conf.d as root
    # before the image's entrypoint drops to the rabbitmq user: the agent
    # writes the file readable by root alone. sh as the first word keeps
    # docker-entrypoint.sh from dropping privileges until the exec.
    command: >-
      sh -c 'cp /ygg/ygg.conf /etc/rabbitmq/conf.d/90-ygg.conf &&
      cp /ygg/enabled_plugins /etc/rabbitmq/enabled_plugins &&
      chmod 644 /etc/rabbitmq/conf.d/90-ygg.conf /etc/rabbitmq/enabled_plugins &&
      exec docker-entrypoint.sh rabbitmq-server'
    volumes:
      - { from: data, to: /var/lib/rabbitmq }
      - { from: ygg, to: /ygg }
    healthcheck:
      command: "rabbitmq-diagnostics -q check_running"
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      # The one broker port real players' game clients actually reach.
      # Management HTTP (15672 internally) is deliberately not published at
      # all: a reference deployment binds it to loopback only, and this
      # platform has no equivalent of a loopback-only allocation -- every
      # allocated port is reachable, so the safer default is not to publish
      # an admin surface nothing here needs. The broker always listens on
      # 5672 inside (TLS only, see configs/rabbitmq-game.conf), so the
      # allocated port is published to that; the gateway hands players the
      # allocated number.
      - { name: rmq-client, protocol: tcp, default: 31982, kind: other, container_port: 5672 }

  # --- Database schema bootstrap -------------------------------------------

  - role: db-init
    name: Database Init
    description: >-
      Funcom's own PostgreSQL schema tool (initdb/startdb/updatedb),
      applying this game's real schema and ~90 stored-procedure files.
      Pulled apart and read directly rather than guessed: its own
      docstrings say startdb "installs and initializes it if needed" and
      updatedb "does nothing if the database is already up to date" --
      genuinely idempotent, which is exactly what yggdrasil's Once
      (ADR-156) needs and asserts nothing beyond.
    once: true
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server-db-utils:2181988-0-shipping", loaded: true }
    depends_on:
      - { role: postgres, condition: healthy }
    # updatedb.py both initializes (delegates through database.ensure_
    # initialized(), same as initdb.py) and applies any new schema patches,
    # so it is the one command that is correct to run on every boot rather
    # than only the first. --unattended matches IGWO's own convention noted
    # in the tool's source (its config reader's own comment: "IGWO adds
    # --unattended to all script calls"). Connection details are passed as
    # CLI overrides rather than through the [DuneDatabaseInterfacePSQL] ini
    # file its config reader prefers, since this seed has no ini file to
    # mount for it -- confirmed from source that CLI flags take precedence
    # over the ini path either way. No separate admin credential: igw-postgres
    # is confirmed to be the stock official image, which makes POSTGRES_USER
    # (dune) the one and only superuser it ever creates, so project and admin
    # credentials are the same role here.
    #
    # --postgres-installation /usr: even against a remote database the tool
    # requires a local PostgreSQL "installation" for its client binaries,
    # found at <dir>/bin, and when it finds none it tries to unpack Funcom's
    # bundled one -- which exists only for Windows (KeyError: 'linux', seen
    # live on build 2181988). The image ships psql at /usr/bin/psql, so /usr
    # is that installation. --no-backup: the image has no pg_dump, so the
    # tool's own pre-update dump would fail; the backup hook on the postgres
    # container above is what backs this database up.
    command: >-
      updatedb.py --unattended
      --postgres-installation /usr
      --no-backup
      --host postgres:5432
      --project-database {{shellquote .Vars.db_name}}
      --project-user dune
      --project-password {{shellquote .Vars.db_password}}
      --admin-user dune
      --admin-password {{shellquote .Vars.db_password}}
      --admin-database {{shellquote .Vars.db_name}}

  - role: partitions
    name: World partitions
    description: >-
      Fills the world_partition table from the worldPartitions list in
      Funcom's own scripts/setup/templates/world-template.yaml, which Funcom's
      database operator does in its Kubernetes setup. A map server with no
      partition row loops on "no partition definition". Reads the template
      from the install on every start, so a Funcom update that adds a
      partition needs no seed change; only inserts what is missing. Also
      warns in its log when Funcom's director.ini has changed from the copy
      this seed ships.
    once: true
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server-db-utils:2181988-0-shipping", loaded: true }
    mount_install: true
    depends_on:
      - { role: db-init, condition: completed }
    # The image's entrypoint is python; this is its argument.
    command: /ygg/sync_partitions.py
    env:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: dune
      PGPASSWORD: "{{.Vars.db_password}}"
      PGDATABASE: "{{.Vars.db_name}}"
      DUNE_WORLD_TEMPLATE: /game/scripts/setup/templates/world-template.yaml
      DUNE_SEED_DIRECTOR_INI: /ygg/director.ini
    volumes:
      - { from: ygg, to: /ygg }

  # --- Battlegroup services: gateway, director, chat, RMQ auth ------------

  - role: gateway
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server-gateway:2181988-0-shipping", loaded: true }
    depends_on:
      - { role: postgres, condition: healthy }
      - { role: game-rmq, condition: healthy }
      - { role: db-init, condition: completed }
      # Logins to either broker are checked by the text router (see
      # configs/rabbitmq-*.conf).
      - { role: text-router, condition: started }
    # A reference deployment starts this with a hardcoded `sleep 30` before
    # execing the real process, presumably because plain Docker Compose
    # depends_on there does not wait for health. This platform's own
    # condition: healthy above should make that unnecessary -- flagged as
    # something to confirm live, not assumed away.
    #
    # The image's own command, plus what Funcom's operator appends for a
    # message queue in Public mode: where players' clients reach the game
    # broker. Without it the gateway has no broker address to hand out.
    command: >-
      python -m service -c /Tools/Battlegroups/GatewayService/service/configs/service.conf
      {{if .NodeAddress}}--RMQGameHostname {{.NodeAddress}} --RMQGamePort {{index .Ports "rmq-client"}}{{end}}
    volumes:
      # configs/gateway.ini, written by config.files below.
      - { from: conf, to: /etc/app/conf.d }
    env:
      DuneDatabaseInterfacePSQL_DatabaseHost: postgres
      DuneDatabaseInterfacePSQL_DatabasePort: "5432"
      DuneDatabaseInterfacePSQL_DatabaseUser: dune
      DuneDatabaseInterfacePSQL_DatabasePassword: "{{.Vars.db_password}}"
      DuneDatabaseInterfacePSQL_DatabaseName: "{{.Vars.db_name}}"
      FuncomLiveServices__ServiceAuthToken: "{{.Vars.fls_token}}"
      FuncomLiveServices__RmqTlsEnabled: "true"
      FuncomLiveServices__BattlegroupAuthorizationPreset: BattlegroupInternal
      FuncomLiveServices__DefaultFlsEnvironment: retail
      OPT_SERVERNAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      BATTLEGROUP: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      OPT_DISPLAY_NAME: "{{.Vars.world_name}}"
      gateway_farm_api_key: "{{.Vars.fls_token}}"
      RMQ_HTTP_TOKEN_AUTH_SECRET: "{{.Vars.rmq_secret}}"
      HOST_DATACENTER_ID: "{{.Vars.datacenter_id}}"
      HOST_DATACENTER_IP_ADDRESS: "{{.NodeAddress}}"

  - role: director
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server-bg-director:2181988-0-shipping", loaded: true }
    depends_on:
      - { role: postgres, condition: healthy }
      - { role: admin-rmq, condition: healthy }
      - { role: game-rmq, condition: healthy }
      - { role: db-init, condition: completed }
      - { role: partitions, condition: completed }
      - { role: text-router, condition: started }
    # A reference deployment's own comment records that Director currently
    # terminates on a malformed login envelope rather than rejecting it --
    # an upstream Funcom bug, not this seed's doing. This platform's own
    # crash-then-restart handling covers exactly that shape; nothing extra
    # needed here beyond knowing it can happen.
    command: >-
      --RMQGameHostname game-rmq --RMQGamePort 5672
      --RMQAdminHostname admin-rmq --RMQAdminPort 5672
    volumes:
      # Funcom's own director.ini (configs/director.ini, written by
      # config.files below), where Funcom's operator mounts it. It sets the
      # BattlegroupInternal authorization preset every Funcom service runs
      # with, the instancing modes and the per-map server limits. The image
      # keeps ./Director as its entrypoint, so the file cannot be extracted
      # from the template at start; the partitions step warns when Funcom's
      # copy changes.
      - { from: conf, to: /etc/app/conf.d }
    env:
      Database__address: postgres
      Database__port: "5432"
      Database__user: dune
      Database__password: "{{.Vars.db_password}}"
      # The database's name. director_config.ini's [Database] declares no
      # key for it: the name normally comes from Funcom's Kubernetes operator
      # (IGWO), and without one the director falls back to a version-derived
      # name (dune_sb_1_5_20_0 on build 2181988) that db-init never creates.
      # The key the fallback reads is not visible from outside the assemblies,
      # so the three spellings it could be are all set; the others are
      # ignored. Unverified until the director is seen connecting.
      Database__database: "{{.Vars.db_name}}"
      Database__dbname: "{{.Vars.db_name}}"
      Database__name: "{{.Vars.db_name}}"
      RMQ_HTTP_TOKEN_AUTH_SECRET: "{{.Vars.rmq_secret}}"
      BATTLEGROUP_DISPLAY_NAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      BATTLEGROUP: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      OPT_SERVERNAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      OPT_DISPLAY_NAME: "{{.Vars.world_name}}"
      FuncomLiveServices__ServiceAuthToken: "{{.Vars.fls_token}}"
      FuncomLiveServices__RmqTlsEnabled: "true"
      FuncomLiveServices__BattlegroupAuthorizationPreset: BattlegroupInternal
      FuncomLiveServices__DefaultFlsEnvironment: retail
      BATTLEGROUP_REGION_NAME: "{{.Vars.region}}"
      HOST_DATACENTER_ID: "{{.Vars.datacenter_id}}"
      HOST_DATACENTER_IP_ADDRESS: "{{.NodeAddress}}"

  - role: text-router
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server-text-router:2181988-0-shipping", loaded: true }
    depends_on:
      - { role: postgres, condition: healthy }
      - { role: admin-rmq, condition: healthy }
      - { role: game-rmq, condition: healthy }
      - { role: db-init, condition: completed }
    command: >-
      --RMQGameHostname game-rmq --RMQGamePort 5672
      --RMQAdminHostname admin-rmq --RMQAdminPort 5672
    env:
      DuneDatabaseInterfacePSQL_DatabaseHost: postgres
      DuneDatabaseInterfacePSQL_DatabasePort: "5432"
      DuneDatabaseInterfacePSQL_DatabaseUser: dune
      DuneDatabaseInterfacePSQL_DatabasePassword: "{{.Vars.db_password}}"
      DuneDatabaseInterfacePSQL_DatabaseName: "{{.Vars.db_name}}"
      # Without these the router crashed at start, in
      # DatabaseConnectionInfo.GetPortFromAddress: the address normally comes
      # from Funcom's operator, and the fallback is this section.
      Database__address: postgres
      Database__port: "5432"
      Database__user: dune
      Database__password: "{{.Vars.db_password}}"
      Database__database: "{{.Vars.db_name}}"
      RMQ_HTTP_TOKEN_AUTH_SECRET: "{{.Vars.rmq_secret}}"
      BATTLEGROUP: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      BATTLEGROUP_DISPLAY_NAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      OPT_SERVERNAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      OPT_DISPLAY_NAME: "{{.Vars.world_name}}"
      BATTLEGROUP_REGION_NAME: "{{.Vars.region}}"
      BATTLEGROUP_LANGUAGE: en-US
      FuncomLiveServices__ServiceAuthToken: "{{.Vars.fls_token}}"
      FuncomLiveServices__RmqTlsEnabled: "true"
      FuncomLiveServices__BattlegroupAuthorizationPreset: BattlegroupInternal
      FuncomLiveServices__DefaultFlsEnvironment: retail
      HOST_DATACENTER_ID: "{{.Vars.datacenter_id}}"
      HOST_DATACENTER_IP_ADDRESS: "{{.NodeAddress}}"

  # --- The playable map itself --------------------------------------------

  - role: game
    primary: true
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server:2181988-0-shipping", loaded: true }
    depends_on:
      - { role: postgres, condition: healthy }
      - { role: admin-rmq, condition: healthy }
      - { role: game-rmq, condition: healthy }
      - { role: db-init, condition: completed }
      - { role: partitions, condition: completed }
      - { role: director, condition: started }
      - { role: gateway, condition: started }
      - { role: text-router, condition: started }
    # db-init is technically transitive here already -- gateway/director/
    # text-router each wait on it themselves, and game only waits for their
    # own start, which cannot happen until their own wait resolves. Declared
    # directly anyway: game is the service actually writing player data, and
    # a reader should not have to trace three hops of transitivity to see
    # that it needs a migrated schema before it starts.
    # The map path comes first. Unreal takes the first argument without a
    # leading dash as the map URL, and the RabbitMQ flags below are written
    # "--Name value", leaving the bare value (game-rmq) ahead of anything
    # later: build 2181988 tried to enter "game-rmq" as its map and crashed.
    # Survival_1's path is the one the server named itself as its default in
    # that same boot log.
    # The launcher is the image's own /home/dune/run.sh (its default command
    # since build 2181988, which dropped ./run_server.sh). It sets up the
    # UserSettings directory, drops to the dune user (Unreal refuses to run
    # as root) and binds IGW to $POD_IP, which Funcom's Kubernetes packaging
    # sets and nothing here does -- so sh -c sets it to this container's own
    # address on the pod network first. Every flag below reaches run.sh as
    # its own argument, unchanged ("$@"), the same three containers alike.
    # Every flag here is confirmed from a real community Docker Compose
    # project's own service definition for its "Survival_1" partition --
    # not yet seen in this seed's own boot output, since it has never
    # booted. PartitionIndex=1 is what makes this the primary survival
    # instance rather than the Overmap or a named social hub -- see the
    # optional map-slot containers below for those.
    command: >-
      sh -c 'POD_IP="$(hostname -i 2>/dev/null | cut -d" " -f1)"; export POD_IP; exec /home/dune/run.sh "$@"' run.sh
      /Game/Dune/Maps/Arrakis/SOC_1/Survival_1
      -FarmRegion={{shellquote .Vars.region}}
      -ini:engine:[FuncomLiveServices]:ServiceAuthToken={{shellquote .Vars.fls_token}}
      -ini:engine:[FuncomLiveServices]:DefaultFlsEnvironment=retail
      -ini:engine:[OnlineSubsystem]:ServerName={{shellquote (or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6))))}}
      -ini:engine:[ConsoleVariables]:Bgd.ServerLoginPassword={{shellquote .Vars.server_login_password}}
      -ini:engine:[OnlineSubsystem]:DatacenterId={{shellquote .Vars.datacenter_id}}
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabaseHost=postgres:5432
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabaseUser=dune
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabaseName={{shellquote .Vars.db_name}}
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabasePassword={{shellquote .Vars.db_password}}
      -RMQGameTlsEnabled=true
      {{if .NodeAddress}}-ExternalAddress={{.NodeAddress}}{{end}}
      --RMQGameHostname game-rmq --RMQGamePort 5672
      --RMQAdminHostname admin-rmq --RMQAdminPort 5672
      -Port={{.Ports.game}} -IGWPort={{index .Ports "game-igw"}}
      -MultiHome=$POD_IP
      -PartitionIndex=1
    env:
      WORLD_NAME: "{{.Vars.world_name}}"
      # What Funcom's server operator sets on every map server.
      BATTLEGROUP_NAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      FARM_NAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      BATTLEGROUP_TITLE: "{{.Vars.world_name}}"
    ports:
      - { name: game, protocol: udp, default: 7777, kind: game }
      # A second UDP channel published alongside the main game port on every
      # map partition in a real reference deployment -- exact purpose
      # ("IGW") not yet confirmed, kept here because omitting a port a real
      # deployment always publishes is a worse guess than including one
      # whose exact job is still unclear.
      - { name: game-igw, protocol: udp, default: 7888, kind: other }

  # --- Optional additional map partitions ---------------------------------
  #
  # A real self-hosted battlegroup can run a farm of up to 30 map partitions
  # (the overmap, individual Sietch/social-hub zones, and repeated Survival
  # dimensions), started and stopped dynamically by the director service
  # above. This platform's pod model is a fixed container set per seed, not
  # a runtime-elastic one -- so real autoscaling is out of scope, and these
  # two are declared as ordinary optional addon containers instead: a small,
  # fixed ceiling an operator can turn on, each its own independently
  # allocated port pair, matching PartitionIndex 2 and 3 in a real
  # deployment.

  - role: overmap
    name: Overmap
    description: >-
      The Dune: Awakening meta-map above individual Sietch/social-hub zones.
      Whether a battlegroup actually needs this running for ordinary play,
      or only for cross-zone travel, is not yet confirmed.
    optional: true
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server:2181988-0-shipping", loaded: true }
    depends_on:
      - { role: game, condition: started }
    command: >-
      sh -c 'POD_IP="$(hostname -i 2>/dev/null | cut -d" " -f1)"; export POD_IP; exec /home/dune/run.sh "$@"' run.sh
      /Game/Dune/Systems/Overmap/Overmap.Overmap
      -FarmRegion={{shellquote .Vars.region}}
      -ini:engine:[FuncomLiveServices]:ServiceAuthToken={{shellquote .Vars.fls_token}}
      -ini:engine:[FuncomLiveServices]:DefaultFlsEnvironment=retail
      -ini:engine:[OnlineSubsystem]:ServerName={{shellquote (or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6))))}}
      -ini:engine:[ConsoleVariables]:Bgd.ServerLoginPassword={{shellquote .Vars.server_login_password}}
      -ini:engine:[OnlineSubsystem]:DatacenterId={{shellquote .Vars.datacenter_id}}
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabaseHost=postgres:5432
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabaseUser=dune
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabaseName={{shellquote .Vars.db_name}}
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabasePassword={{shellquote .Vars.db_password}}
      -RMQGameTlsEnabled=true
      {{if .NodeAddress}}-ExternalAddress={{.NodeAddress}}{{end}}
      --RMQGameHostname game-rmq --RMQGamePort 5672
      --RMQAdminHostname admin-rmq --RMQAdminPort 5672
      -Port={{index .Ports "overmap-port"}} -IGWPort={{index .Ports "overmap-igw"}}
      -MultiHome=$POD_IP
      -PartitionIndex=2
    env:
      WORLD_NAME: "{{.Vars.world_name}}"
      # What Funcom's server operator sets on every map server.
      BATTLEGROUP_NAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      FARM_NAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      BATTLEGROUP_TITLE: "{{.Vars.world_name}}"
    ports:
      - { name: overmap-port, protocol: udp, default: 7778, kind: other }
      - { name: overmap-igw, protocol: udp, default: 7889, kind: other }

  - role: arrakeen
    name: Arrakeen
    description: The Arrakeen social hub -- a fixed, named map zone rather than a repeated Survival dimension.
    optional: true
    image: { ref: "registry.funcom.com/funcom/self-hosting/seabass-server:2181988-0-shipping", loaded: true }
    depends_on:
      - { role: game, condition: started }
    command: >-
      sh -c 'POD_IP="$(hostname -i 2>/dev/null | cut -d" " -f1)"; export POD_IP; exec /home/dune/run.sh "$@"' run.sh
      /Game/Dune/Maps/SocialHubs/Arrakeen/SH_Arrakeen.SH_Arrakeen
      -FarmRegion={{shellquote .Vars.region}}
      -ini:engine:[FuncomLiveServices]:ServiceAuthToken={{shellquote .Vars.fls_token}}
      -ini:engine:[FuncomLiveServices]:DefaultFlsEnvironment=retail
      -ini:engine:[OnlineSubsystem]:ServerName={{shellquote (or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6))))}}
      -ini:engine:[ConsoleVariables]:Bgd.ServerLoginPassword={{shellquote .Vars.server_login_password}}
      -ini:engine:[OnlineSubsystem]:DatacenterId={{shellquote .Vars.datacenter_id}}
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabaseHost=postgres:5432
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabaseUser=dune
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabaseName={{shellquote .Vars.db_name}}
      -ini:game:[DuneDatabaseInterfacePSQL]:DatabasePassword={{shellquote .Vars.db_password}}
      -RMQGameTlsEnabled=true
      {{if .NodeAddress}}-ExternalAddress={{.NodeAddress}}{{end}}
      --RMQGameHostname game-rmq --RMQGamePort 5672
      --RMQAdminHostname admin-rmq --RMQAdminPort 5672
      -Port={{index .Ports "arrakeen-port"}} -IGWPort={{index .Ports "arrakeen-igw"}}
      -MultiHome=$POD_IP
      -PartitionIndex=3
    env:
      WORLD_NAME: "{{.Vars.world_name}}"
      # What Funcom's server operator sets on every map server.
      BATTLEGROUP_NAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      FARM_NAME: '{{or .Vars.battlegroup_id (printf "sh-%s-%s" (lower (jwtclaim .Vars.fls_token "HostId")) (tr "0123456789abcdef" "abcdefghijklmnop" (slice .ServerID 0 6)))}}'
      BATTLEGROUP_TITLE: "{{.Vars.world_name}}"
    ports:
      - { name: arrakeen-port, protocol: udp, default: 7779, kind: other }
      - { name: arrakeen-igw, protocol: udp, default: 7890, kind: other }

  # --- Operator UI addons --------------------------------------------------

  - role: director-panel
    name: Director
    description: >-
      dune-admin, a web dashboard for battlegroup operations: player list,
      map status, server settings, welcome kits and more. Not the same
      thing as the director container above, which is Funcom's own
      map-lifecycle orchestrator -- this is an operator-facing panel that
      talks to it and to the database/brokers directly.
    optional: true
    image: { base: linux }
    # The panel's binary is in the install, which only the primary used to
    # mount; this is the exit 127 every earlier version of this seed hit.
    mount_install: true
    # Run from wherever the archive put the binary: a dune-admin directory,
    # or /game/dune-admin itself. The install block is left exactly as 0.5.0
    # had it, so changing this needs no new download of the game files.
    workdir: /game
    # -setup normally runs interactively on first install; this addon has
    # no way to run that wizard, so its config has to be supplied entirely
    # through environment variables (the "docker" provider mode's own
    # supported path) rather than the generated config.yaml a real install
    # would produce. Confirmed field names from the tool's own published
    # documentation, not yet from a real boot.
    command: >-
      sh -c 'if [ -d /game/dune-admin ]; then cd /game/dune-admin; fi; exec ./dune-admin'

    env:
      CONTROL: docker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dune
      DB_PASS: "{{.Vars.db_password}}"
      DB_NAME: "{{.Vars.db_name}}"
      DB_SCHEMA: dune
      BROKER_GAME_ADDR: "game-rmq:5672"
      BROKER_ADMIN_ADDR: "admin-rmq:5672"
      LISTEN_ADDR: ":8080"
    depends_on:
      - { role: postgres, condition: healthy }
      - { role: game, condition: started }
    ports:
      - { name: director-web, protocol: tcp, default: 8080, kind: web }
    ui:
      tab: Director
      port: director-web

variables:
  - name: world_name
    label: World name
    description: The save/world identifier, shown to players.
    default: World
    editable: true

  - name: battlegroup_id
    label: Battlegroup ID (override)
    description: >-
      Leave blank. Funcom Live Services lets a self-host token manage only the
      battlegroup named sh-<HostId>-<six lowercase letters>, where the HostId
      is read from the token itself; this server derives it, as Funcom's own
      setup script does, with the letters taken from the server's id. A digit
      in the suffix is refused. Set this only to keep the
      identity of a battlegroup registered elsewhere (an AMP or Funcom-script
      install), in that exact form.
    default: ""
    editable: true

  - name: region
    label: Region
    description: >-
      The region Funcom Live Services lists this battlegroup under, passed as
      -FarmRegion and BATTLEGROUP_REGION_NAME. One of the five regions Funcom's
      own setup script offers.
    type: select
    default: North America
    editable: true
    options:
      - { value: North America, label: North America }
      - { value: South America, label: South America }
      - { value: Europe, label: Europe }
      - { value: Asia, label: Asia }
      - { value: Oceania, label: Oceania }

  - name: datacenter_id
    label: Datacenter ID
    description: Passed to Funcom Live Services as this server's datacenter identifier. Exact meaning not yet confirmed.
    default: "1"
    editable: true

  - name: db_name
    label: Database name
    description: >-
      A real deployment's own default embeds a build-specific suffix
      (observed: dune_sb_1_4_0_0) rather than a bare "dune" -- kept
      operator-editable rather than hardcoded until that pattern is
      confirmed against this seed's own install.
    default: "dune"
    editable: true

  - name: fls_token
    label: Funcom Live Services token
    description: >-
      The self-hosting token from Funcom's own account portal
      (account.duneawakening.com). Required to register this server with
      Funcom Live Services at all.
    type: password
    required: true
    editable: true

  - name: server_login_password
    label: Server password
    description: Leave blank for a public server. Sent to players joining as the world's own connect password.
    type: password
    default: ""
    editable: true

  - name: db_password
    label: Database password
    description: >-
      Shared by every service that talks to PostgreSQL as the "dune" user --
      including db-init's admin operations, since igw-postgres is confirmed
      to be the stock official image, which makes POSTGRES_USER (dune) the
      one and only superuser it ever creates. A previous version of this
      seed generated a second, separate db_super_password for a
      POSTGRES_SUPER_PASSWORD env var; removed once the real image was
      confirmed to read no such variable at all.
    generate: password
    default: ""
    editable: true

  - name: rmq_secret
    label: RabbitMQ HTTP auth secret
    description: An internally-generated secret both brokers' own HTTP token auth backend is keyed on -- not a Funcom-issued credential.
    generate: hex
    default: ""
    editable: true

# No settings: block yet. Every configurable value confirmed so far reaches
# a command line or an env var shared by more than one container, which is
# what a variable is for -- nothing found yet is genuinely single-file,
# single-key game configuration in the way settings: exists to express.

# Files Funcom's Kubernetes operators would otherwise have mounted into each
# service. Sidecar volumes live under the server's own directory at
# volumes/<role>/<from>, which is where these are written.
config:
  files:
    - { path: volumes/admin-rmq/ygg/ygg.conf, source_path: configs/rabbitmq-admin.conf, manage: always }
    - { path: volumes/admin-rmq/ygg/enabled_plugins, source_path: configs/rabbitmq-enabled-plugins, manage: always }
    - { path: volumes/game-rmq/ygg/ygg.conf, source_path: configs/rabbitmq-game.conf, manage: always }
    - { path: volumes/game-rmq/ygg/enabled_plugins, source_path: configs/rabbitmq-enabled-plugins, manage: always }
    - { path: volumes/director/conf/director.ini, source_path: configs/director.ini, manage: always }
    - { path: volumes/gateway/conf/gateway.ini, source_path: configs/gateway.ini, manage: always }
    - { path: volumes/partitions/ygg/sync_partitions.py, source_path: configs/sync_partitions.py, manage: always }
    - { path: volumes/partitions/ygg/director.ini, source_path: configs/director.ini, manage: always }

stop:
  # Confirmed from real deployment: SIGTERM with a long timeout, not a
  # console command -- no evidence this game accepts one over stdin.
  timeout: 120s
  then: SIGTERM

# Readiness stays immediate: no real boot output exists yet to write a log
# pattern against, and mode: port would need to know which of this pod's
# many ports actually signals readiness, which is exactly the kind of guess
# this catalog's own rule against unverified patterns exists to prevent.

connect:
  copy: "{{.Endpoint.game}}"

backup:
  include: [saved]

# ---------------------------------------------------------------------------
# What has been seen working, and what has not
#
# Seen live on a real node (0.5.x and 0.6.0's own tests):
#   - every image loads from the depot and the pod provisions
#   - db-init applies Funcom's schema; the partitions step fills all 35
#     partitions from the template and adds none on a second run (tested
#     against Funcom's real db-utils and postgres images)
#   - the game broker's TLS listener on 5672 and its auth plugins (tested
#     against Funcom's real RabbitMQ image)
#   - FLS accepts the director for sh-<HostId>-<six letters> and refuses a
#     suffix with a digit
#
# Not yet seen: a player connecting; the map servers getting past partition
# loading with the director initialised; the dune-admin panel's own config.
# The director logs "Missing required environment variable for IGWO": IGWO is
# Funcom's Kubernetes API, used to scale map servers, and community Docker
# deployments run without it.
# ---------------------------------------------------------------------------
