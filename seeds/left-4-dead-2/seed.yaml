id: left-4-dead-2
schema: 3
name: Left 4 Dead 2
description: >
  Four survivors, an endless horde, and five campaigns to fight through.
  This seed installs the base game's five official campaigns in
  cooperative mode -- see the game mode/map fields below for what else is
  and isn't in scope. Runs under Proton -- see the install block below for
  why -- and boot has not yet been confirmed against a real server.
version: "1.1.0"

# The base game's own Steam listing (550) is fully covered -- header,
# capsule and hero art all confirmed present -- unlike the dedicated-server
# tool app (222860) installed below, whose own store page is real but
# deliberately unlisted by the publisher and missing its header/capsule
# art entirely (confirmed via Steam's own appdetails API). Same
# tool-app-vs-base-game split team-fortress-2 and garrys-mod already
# document; 550 is also the id Valve's own GSLT generator wants for this
# game, not 222860.
branding:
  steam_app_id: 550
  icon: icon.jpg
  logo: logo.png
  banner: banner.jpg

# GE-Proton is amd64-only (ADR-094), same as every other seed built on
# base-steamcmd-proton.
architectures: [amd64]

install:
  # Shared for the same reason team-fortress-2's and garrys-mod's are: the
  # base game's files are static assets with no per-server state baked
  # into them. This seed does not manage custom campaigns or Workshop
  # addons (out of scope for v1, the same reasoning garrys-mod gives for
  # skipping Workshop content), so nothing server-specific ever needs to
  # land inside the install directory itself.
  #
  # install.image stays the plain steamcmd base, not steamcmd-proton --
  # fetching the depot needs SteamCMD only, never Wine/Proton. Only the
  # *runtime* container below needs Proton, matching ark-survival-ascended's
  # own split.
  shared: true
  mount: { path: /game, mode: ro }
  image: { base: steamcmd }
  steps:
    # osarch: 32 and platform: windows are both load-bearing, and both were
    # found the hard way against a real node, not assumed:
    #
    # 222860's own Linux-tagged depot is confirmed 32-bit only (LinuxGSM's
    # config declares no 64-bit branch, and a real community report has a
    # 64-bit Metamod/SourceMod build failing against this game's own srcds
    # with "wrong ELF class: ELFCLASS64") -- osarch: 32 alone was not
    # enough, though: forcing platform: linux (this project's own ADR-010
    # default) with osarch: 32 still failed live, three retries running,
    # with ERROR! Failed to install app '222860' (Invalid platform).
    #
    # A live `+app_info_print 222860` (run against a real node, not
    # inferred) settles why: a genuine Linux-tagged depot (222863) exists
    # in this app's own manifest, declares no osarch restriction at all,
    # and is still refused by anonymous SteamCMD login regardless of
    # bitness -- confirmed by forcing linux at both osarch: 32 and
    # osarch: 64 and getting the identical rejection both times. The
    # windows-tagged depot (222862) is what anonymous login can actually
    # reach, and forcing platform: windows is what makes the install
    # complete at all (ADR-123 and its amendment in the main repo's
    # docs/decisions.md carry the full live account).
    #
    # What that install actually contains is the real, unmodified Windows
    # build -- srcds.exe, left4dead2.exe, no srcds_run or srcds_linux
    # anywhere in the tree, confirmed by dumping the installed directory on
    # a real node. That is why this seed runs under Proton below rather
    # than execing a native Linux binary the way team-fortress-2's and
    # garrys-mod's seeds do -- there is no native Linux binary to exec.
    - op: steamcmd
      app_id: 222860
      osarch: 32
      platform: windows

server:
  # LinuxGSM's own directory layout (systemdir="${serverfiles}/left4dead2",
  # servercfgdir="${systemdir}/cfg", gamelogdir="${systemdir}/logs") --
  # structurally identical to team-fortress-2's tf/cfg, tf/logs split and
  # garrys-mod's garrysmod/cfg, garrysmod/logs split, since all three are
  # the same ordinary Source engine directory convention. Unaffected by
  # the move to Proton -- these are the game's own paths under the install
  # mount, not anything Wine/Proton touches.
  writable_paths:
    - { from: cfg, to: /game/left4dead2/cfg }
    - { from: logs, to: /game/left4dead2/logs }
    # HOME for the container's steam user, the same role it plays in
    # ark-survival-ascended's own seed: the Wine prefix (compatdata), the
    # native steamclient.so ygg-proton stages into .steam/sdk32, and
    # Proton's own scratch state all live here, so it must be per-server
    # and writable, never part of the shared read-only install (ADR-018).
    - { from: home, to: /home/steam }

containers:
  - role: game
    primary: true
    # base-steamcmd-proton, not base-steamcmd: the installed depot is a
    # genuine Windows build (see the install step's own comment above), so
    # running it needs Wine/Proton, not a native Linux exec. Named
    # symbolically rather than pinned to a literal image reference, the
    # same reasoning ark-survival-ascended's own seed gives: a fix on
    # develop has to be able to reach a node before it is promoted.
    image: { base: steamcmd-proton }
    # ygg-proton (base-steamcmd-proton's own entrypoint wrapper) is what
    # replaced this seed's old hand-rolled steamclient.so symlink dance --
    # the exact class of container-prep the project's own convention now
    # says belongs in the base image, never a seed's launch command. It
    # already stages SteamCMD's real steamclient.so into $HOME/.steam/sdk32
    # *and* sdk64 for every seed that runs under it, resolves a relative
    # exe path to absolute (Proton hands the path to Wine as-is), and uses
    # waitforexitandrun so the container does not exit while the game is
    # still starting. See that script for the full account.
    #
    # Everything past `ygg-proton srcds.exe` is the same launch line the
    # old native-Linux command used against srcds_run -- -game, the port
    # and player flags, the map/mode/password cvars -- unaffected by the
    # runtime swap, since these are ordinary Source engine arguments the
    # binary itself parses regardless of which OS it thinks it is running
    # on.
    #
    # NOT YET CONFIRMED AGAINST A REAL BOOT. This mirrors
    # ark-survival-ascended's own known-working Proton shape as closely as
    # this game's differences allow, but Source engine's console behaviour
    # under Wine (whether stdout actually reaches Docker's log stream the
    # way it does for a native srcds_run, the way ARK's own Unreal console
    # famously did not) has not been checked against a real process. If
    # the console stays empty after a real boot, add -condebug
    # +con_logfile <path> and tail that file the way
    # ark-survival-ascended's own command tails ShooterGame.log, rather
    # than guessing which one is needed up front.
    command: >-
      ygg-proton srcds.exe -game left4dead2 -console -strictportbind -norestart
      -ip 0.0.0.0 -port {{.Ports.game}}
      +clientport {{.Ports.clientport}}
      -maxplayers {{.Vars.max_players}}
      +map {{.Vars.map}}
      +mp_gamemode {{.Vars.gamemode}}
      +hostname "{{.Vars.server_name}}"
      +servercfgfile server.cfg
      +rcon_password "{{.Vars.rcon_password}}"
      +sv_setsteamaccount "{{.Vars.gslt}}"
      {{if .Vars.sv_password}}+sv_password "{{.Vars.sv_password}}"{{end}}
    workdir: /game
    env:
      HOME: /home/steam
      # The image always takes ownership of HOME; this is the seed's own
      # writable game-config mounts that also have to belong to the
      # container's user, the same reasoning ark-survival-ascended's own
      # YGG_PROTON_CHOWN_DIRS gives. Not yet hit live for this seed; added
      # on inspection, matching how ark-survival-ascended's own mods entry
      # was added.
      YGG_PROTON_CHOWN_DIRS: "/game/left4dead2/cfg /game/left4dead2/logs"
      # Must end in the Steam app id -- Proton's protonfixes parses it back
      # out of this path with a regex. 222860 is the dedicated-server tool
      # app installed above, the same app id ark-survival-ascended's own
      # STEAM_COMPAT_DATA_PATH ends in its own tool app's id rather than
      # the base game's.
      STEAM_COMPAT_DATA_PATH: /home/steam/compatdata/222860
      STEAM_COMPAT_CLIENT_INSTALL_PATH: /home/steam/steam
    ports:
      # Same shape as team-fortress-2's and garrys-mod's: Source's query
      # protocol answers on the same UDP port as gameplay traffic, and
      # RCON is TCP on the identical port number -- confirmed here too,
      # since -usercon does not apply and RCON falls back to the classic
      # Source RCON path (TCP on the game's own port). Unaffected by the
      # move to Proton -- these are the engine's own ports, not anything
      # Wine/Proton allocates.
      - { name: game, protocol: udp, default: 27015, kind: game }
      - { name: rcon, protocol: tcp, offset_from: game, offset: 0 }
      # +clientport, confirmed by LinuxGSM's own startparameters
      # (clientport="27005") -- the identical default team-fortress-2's
      # and garrys-mod's own clientport documents.
      - { name: clientport, protocol: udp, default: 27005, kind: other }

variables:
  - { name: server_name, group: Server, label: Server name, description: Shown in the in-game server browser., default: "A Yggdrasil server", editable: true }
  - name: gamemode
    group: Server
    label: Game mode
    description: >-
      The mode played. Mutations and the team-based versus/scavenge
      variants are Workshop or custom-mode content this seed does not
      install.
    type: select
    default: coop
    editable: true
    options:
      - { value: coop, label: "Campaign (Co-op)" }
      - { value: realism, label: "Realism" }
      - { value: versus, label: "Versus" }
      - { value: survival, label: "Survival" }
      - { value: scavenge, label: "Scavenge" }
  - name: map
    group: Server
    label: Campaign
    description: >-
      The campaign loaded on startup, by its first map -- the game
      advances through the rest of that campaign on its own. Only the
      five base-game campaigns are guaranteed present; any other campaign
      needs Workshop content this seed does not install.
    type: select
    default: c1m1_hotel
    editable: true
    options:
      - { value: c1m1_hotel, label: "Dead Center" }
      - { value: c2m1_highway, label: "Dark Carnival" }
      - { value: c3m1_plankcountry, label: "Swamp Fever" }
      - { value: c4m1_milltown_a, label: "Hard Rain" }
      - { value: c5m1_waterfront, label: "The Parish" }
  - name: max_players
    group: Server
    label: Max players
    description: Eight is the engine's own hard ceiling for this game, reached in Versus; a Campaign server only ever seats four.
    type: number
    min: 1
    max: 8
    step: 1
    default: "8"
    editable: true
  - name: sv_password
    group: Server
    label: Server password
    description: Leave blank for a public server. Set to require players to enter a password to join.
    type: password
    default: ""
    editable: true

  - name: rcon_password
    group: Remote access
    type: password
    generate: password
    label: RCON password
    description: Required to use RCON tools against this server. Generated per server rather than left blank.
    default: ""
    editable: true
  - name: gslt
    group: Remote access
    label: Game Server Login Token
    description: >-
      Optional. Identifies this server to Steam so it can appear in the
      in-game server browser and be favorited by players. Generate one at
      steamcommunity.com/dev/managegameservers using 550 (the base game's
      own app id) as the "App ID of the base game" field. Left blank, the
      server still runs and accepts direct connections by IP.
    default: ""
    editable: true

groups:
  - name: Server
    description: Identity, mode, campaign, and player limits.
  - name: Remote access
    description: RCON and Steam server-browser listing.
    collapsed: true

# mode: immediate, for the same reason team-fortress-2's and garrys-mod's
# are: a real boot has not yet confirmed how early the RCON TCP listener
# actually opens relative to the engine finishing initialization, so a
# mode: port guess risks reporting ready before the server can genuinely
# serve players. Doubly true here until a real boot under Proton is
# confirmed at all.
ready:
  mode: immediate

# Source engine's own dedicated-server console is genuinely interactive
# over stdin -- the same mechanism team-fortress-2's and garrys-mod's own
# seeds document, confirmed for this game too by LinuxGSM's l4d2server
# module declaring stopmode="3" (send the literal command "quit" and
# wait), the identical graceful-shutdown convention every other Source
# engine seed in this catalog uses. Not yet confirmed that stdin reaches
# srcds.exe the same way under Proton as it did for the native srcds_run
# process this seed used to run.
stop:
  command: "quit"
  timeout: 30s
  then: SIGTERM

connect:
  label: "Join by IP"
  copy: "{{.Endpoint.game}}"

backup:
  include: [cfg]
