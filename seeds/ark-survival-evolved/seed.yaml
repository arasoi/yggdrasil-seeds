id: ark-survival-evolved
schema: 3
name: ARK Survival Evolved
icon: "🦴"
description: >
  Dedicated server for the original ARK: Survival Evolved. Several maps can
  share one copy of the game files and a cluster volume, so players keep
  their characters and items when they travel between maps.
version: "1.0.1"

branding:
  steam_app_id: 346110
  logo: logo.png
  banner: banner.jpg

# Unlike ARK Survival Ascended (ADR-047's whole account of a Windows-only
# depot run under Proton), ASE ships a real native Linux dedicated server.
# No Proton, no Wine, no wrapper script -- base-steamcmd is enough, and the
# architecture here is genuinely the binary's, not merely the node's.
architectures: [amd64]

install:
  shared: true
  mount: { path: /game, mode: ro }
  image: { base: steamcmd }
  steps:
    # The dedicated-server tool's own app id (376030), not the base game's
    # (346110) -- the same split ADR-051 already records for Valheim, and
    # the two are commonly confused for exactly this game.
    - op: steamcmd
      app_id: 376030

server:
  writable_paths:
    - { from: saved, to: /game/ShooterGame/Saved }
    - { from: config, to: /game/ShooterGame/Saved/Config }

cluster:
  supported: true
  mount: /cluster
  args: ["-clusterid={{.ClusterID}}", "-ClusterDirOverride=/cluster"]

containers:
  - role: game
    primary: true
    image: { base: linux }
    # No shell wrapper, no log-tailing trick: unlike ASA under Proton (whose
    # own seed has to background a `tail -F` because Proton's own startup
    # noise drowns out the one line readiness needs), a native Linux server
    # writes ShooterGame.log the same way and ALSO prints its own console
    # output straight to stdout, so the console shows the real thing and
    # readiness can match it directly.
    #
    # -clusterid=/-ClusterDirOverride= are appended by the cluster block
    # above, only when this server is actually a cluster member.
    command: >-
      ./ShooterGame/Binaries/Linux/ShooterGameServer
      {{.Vars.map}}?listen?SessionName={{.Vars.session_name}}?Port={{.Ports.game}}?QueryPort={{.Ports.query}}?RCONPort={{.Ports.rcon}}?RCONEnabled=True?ServerAdminPassword={{.Vars.admin_password}}?MaxPlayers={{.Vars.max_players}}
      -server -log -NoBattlEye -servergamelog
    workdir: /game
    env:
      # A Steamworks-linked binary loads its native client library from this
      # fixed, Linux-Steam-convention path regardless of anything else on the
      # command line -- ADR-047's final amendment traces the identical
      # requirement for ASA back to lsteamclient.so's own hardcoded search
      # path, and ASE's Linux depot ships its own copy the same way ASA's
      # Windows one does. Untested against a real ASE server (no Linux depot
      # has been fetched for it here); named because it is the documented,
      # load-bearing fix for the identical symptom in the sibling seed, not
      # because it has been reproduced for this one.
      HOME: /home/steam
    ports:
      - { name: game, protocol: udp, default: 7777 }
      # ARK binds a second UDP socket at game+1 -- its raw/reliable channel --
      # and derives that number from Port itself: there is no argument or ini
      # key for it, which is why nothing below references this port. Declared
      # all the same, because a port the game binds and the control plane
      # does not know about is one it will hand to another server.
      #
      # Not hypothetical: this is the exact fix ARK Survival Ascended's own
      # seed needed after a live incident (game_raw on one ASA map silently
      # collided with another server's game port). ASE shares the same
      # underlying networking code, so the same socket is declared here from
      # the start rather than waiting to rediscover it independently.
      #
      # offset_from is what makes the pair atomic (ADR-083): a base candidate
      # is only accepted once game+1 is confirmed free too, so the two move
      # together instead of one being claimed without the other. Declared
      # before query for the same reason ASA's own fix records: ports
      # allocate in declaration order, and an independent port declared first
      # could otherwise be granted the number this sibling needs.
      - { name: game_raw, protocol: udp, offset_from: game, offset: 1 }
      # Independent, unlike game_raw: ARK takes ?QueryPort= and binds
      # whatever it is given, so this does not have to sit next to the game
      # port -- and must not be assumed to.
      - { name: query, protocol: udp, default: 27015 }
      - { name: rcon, protocol: tcp, default: 27020 }

variables:
  # Plain "TheIsland", never ASA's "TheIsland_WP" -- the "_WP" suffix names
  # ASA's Unreal Engine 5 World Partition rebuild of the map and does not
  # exist in ASE's own install at all.
  - { name: map, default: TheIsland, editable: true }
  - { name: session_name, default: YggdrasilARK, editable: true }
  - { name: max_players, default: "70", editable: true }
  # RCON only actually binds its port when an admin password is set, the
  # same behaviour ASA's own seed already records against a live server;
  # not independently re-verified against ASE, but it is the same engine
  # option (ServerAdminPassword) on both games. Change it before exposing a
  # server; it is also the in-game EnableCheats password.
  - { name: admin_password, default: changeme, editable: true }

groups:
  - name: Server
    description: Identity, passwords, and how often the world is written to disk.
  - name: Rules and access
    description: What the client is allowed to show and do.
    collapsed: true
  - name: "Rates: experience"
    collapsed: true
  - name: "Rates: harvesting"
    collapsed: true
  - name: "Rates: taming"
    collapsed: true
  - name: Players
    description: Survivor stats, drain rates, and crafting.
    collapsed: true
  - name: Dinos
    description: Wild and tamed creature stats, limits, and decay.
    collapsed: true
  - name: Breeding and imprinting
    collapsed: true
  - name: Structures
    collapsed: true
  - name: PvP and raiding
    collapsed: true
  - name: Tribes
    collapsed: true
  - name: World and time
    collapsed: true
  - name: Cluster transfers
    description: >-
      What may cross between servers sharing this cluster. Only meaningful on a
      server that is in one.
    collapsed: true
  - name: Advanced
    description: >-
      Engine-level and rarely-touched keys. Every one of these has a default the
      game itself supplies, so leaving them alone is the ordinary case.
    collapsed: true

# ARK's own configuration, written into GameUserSettings.ini and Game.ini.
#
# WHY THESE ARE SETTINGS AND NOT VARIABLES: a variable reaches the command line
# and rebuilds the pod; a setting declares where its value lands (ADR-077). All
# of these are ini keys, so they are settings, and the four variables above stay
# variables because they are genuinely command-line arguments.
#
# DELIBERATELY ABSENT: SessionName, MaxPlayers, ServerAdminPassword, RCONEnabled,
# RCONPort, Port and QueryPort. Every one of them is already passed on the
# command line above, where ARK gives it precedence over the ini, so declaring
# both would create two writers for one value and a precedence rule an operator
# would have to know. The command line wins; these are not offered twice.
#
# EVERY ONE OF THESE IS `optional: true`, and that is load-bearing rather than
# tidy. An absent optional setting leaves its destination alone entirely — the
# key is not written at all (ADR-077's tri-state) — so a brand-new server gets
# ARK's own defaults, exactly as an operator installing by hand would see,
# because nothing here is written until an operator asks for it. The protection
# is real but not permanent: the settings form renders every control, so the
# first save makes every setting present and writes it. An operator with an ini
# they care about (installed by some other means before adopting this seed)
# should use "Import from disk" on the settings page first — both files below
# are marked importable for exactly this — which reads their values back and
# adopts them, so the first save writes what they already had.
#
# THE KEY NAMES, SECTIONS AND DEFAULTS ARE CARRIED OVER FROM THIS PROJECT'S
# ARK SURVIVAL ASCENDED SEED, not independently re-sourced for this game. That
# is deliberate rather than lazy: the two games share the overwhelming
# majority of their GameUserSettings.ini/Game.ini surface, since ASA is built
# on the same server-configuration lineage ASE established, and every key name
# below matches ARK's own long-published wiki documentation for both games.
# NOT VERIFIED AGAINST A RUNNING ASE SERVER, though — this seed has never run
# end to end through yggd. A key whose spelling is wrong is *silently ignored*
# by Unreal rather than rejected, so a setting that appears to save and does
# nothing is the failure mode to expect here, and a key genuinely specific to
# one game and not the other (if one exists among these) would fail the same
# silent way. Treat a value that seems not to take effect as a seed bug worth
# reporting, not as an operator error.
settings:
  # ---- Server ------------------------------------------------------------
  - name: server_password
    group: Server
    type: password
    label: Join password
    description: Required to connect. Blank leaves the server open.
    default: ""
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ServerPassword }
  - name: spectator_password
    group: Server
    type: password
    label: Spectator password
    description: Lets a non-admin enter spectator mode with /spectator.
    default: ""
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/SpectatorPassword }
  - name: server_pve
    group: Server
    type: bool
    label: PvE mode
    description: Players cannot damage each other or each other's structures.
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ServerPVE }
  - name: server_hardcore
    group: Server
    type: bool
    label: Hardcore
    description: Death resets the survivor to level 1.
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ServerHardcore }
  - name: difficulty_offset
    group: Server
    type: number
    label: Difficulty offset
    description: >-
      0 to 1, scaling wild creature levels. Use with "Override official
      difficulty" below, which is what actually sets the level cap.
    min: 0
    max: 1
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/DifficultyOffset }
  - name: override_official_difficulty
    group: Server
    type: number
    label: Override official difficulty
    description: >-
      Max wild level is this times 30. 5.0 gives level 150 wilds, the official
      value; 1.0 gives level 30.
    min: 0
    step: 0.001
    default: "5.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/OverrideOfficialDifficulty }
  - name: auto_save_period_minutes
    group: Server
    type: number
    label: Autosave interval (minutes)
    description: How often the world is written to disk. Saving briefly stalls the server.
    min: 1
    max: 240
    step: 1
    default: "15"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/AutoSavePeriodMinutes }
  - name: kick_idle_players_period
    group: Server
    type: number
    label: Kick idle after (seconds)
    description: 0 never kicks.
    min: 0
    step: 1
    default: "3600"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/KickIdlePlayersPeriod }
  - name: motd
    group: Server
    label: Message of the day
    description: Shown to a player as they join.
    default: ""
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: MessageOfTheDay/Message }
  - name: motd_duration
    group: Server
    type: number
    label: Message of the day duration (seconds)
    min: 1
    max: 120
    step: 1
    default: "20"
    show_if: { name: motd, not_equals: "" }
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: MessageOfTheDay/Duration }
  - name: ban_list_url
    group: Server
    label: Ban list URL
    description: A shared ban list this server honours. Blank uses only the local one.
    default: ""
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/BanListURL }
  - name: global_voice_chat
    group: Server
    type: bool
    label: Global voice chat
    description: Voice reaches the whole server rather than only nearby players.
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/GlobalVoiceChat }
  - name: proximity_chat
    group: Server
    type: bool
    label: Proximity text chat
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ProximityChat }
  - name: always_notify_player_joined
    group: Server
    type: bool
    label: Announce joins
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/AlwaysNotifyPlayerJoined }
  - name: always_notify_player_left
    group: Server
    type: bool
    label: Announce leaves
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/AlwaysNotifyPlayerLeft }

  # ---- Rules and access --------------------------------------------------
  - name: allow_third_person
    group: Rules and access
    type: bool
    label: Allow third person
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/AllowThirdPersonPlayer }
  - name: server_crosshair
    group: Rules and access
    type: bool
    label: Crosshair
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ServerCrosshair }
  - name: server_force_no_hud
    group: Rules and access
    type: bool
    label: Force HUD off
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ServerForceNoHUD }
  - name: show_map_player_location
    group: Rules and access
    type: bool
    label: Show own position on the map
    description: Off means a player has to work out where they are.
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ShowMapPlayerLocation }
  - name: show_floating_damage_text
    group: Rules and access
    type: bool
    label: Floating damage numbers
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ShowFloatingDamageText }
  - name: allow_hit_markers
    group: Rules and access
    type: bool
    label: Hit markers
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/AllowHitMarkers }
  - name: enable_pvp_gamma
    group: Rules and access
    type: bool
    label: Allow gamma adjustment in PvP
    description: On lets a player brighten their own night, which is usually the point of turning it off.
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/EnablePvPGamma }
  - name: disable_pve_gamma
    group: Rules and access
    type: bool
    label: Block gamma adjustment in PvE
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/DisablePvEGamma }
  - name: use_corpse_locator
    group: Rules and access
    type: bool
    label: Corpse locator beam
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/UseCorpseLocator }
  - name: prevent_spawn_animations
    group: Rules and access
    type: bool
    label: Skip spawn animation
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/PreventSpawnAnimations }
  - name: prevent_diseases
    group: Rules and access
    type: bool
    label: Disable diseases
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/PreventDiseases }
  - name: non_permanent_diseases
    group: Rules and access
    type: bool
    label: Diseases are curable
    description: A disease is lost on respawn rather than kept for the character's life.
    true_value: "True"
    false_value: "False"
    default: "False"
    show_if: { name: prevent_diseases, equals: "False" }
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/NonPermanentDiseases }
  - name: allow_hide_damage_source_from_logs
    group: Rules and access
    type: bool
    label: Hide damage source in the tribe log
    true_value: "True"
    false_value: "False"
    default: "True"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/AllowHideDamageSourceFromLogs }

  # ---- Rates: experience -------------------------------------------------
  - name: xp_multiplier
    group: "Rates: experience"
    type: number
    label: Experience multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/XPMultiplier }
  - name: kill_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Kill XP multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/KillXPMultiplier }
  - name: harvest_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Harvest XP multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/HarvestXPMultiplier }
  - name: craft_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Craft XP multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/CraftXPMultiplier }
  - name: generic_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Generic XP multiplier
    description: Passive experience, earned just for being alive.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/GenericXPMultiplier }
  - name: special_xp_multiplier
    group: "Rates: experience"
    type: number
    label: Special event XP multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/SpecialXPMultiplier }

  # ---- Rates: harvesting -------------------------------------------------
  - name: harvest_amount_multiplier
    group: "Rates: harvesting"
    type: number
    label: Harvest amount multiplier
    description: How much a single harvest yields.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/HarvestAmountMultiplier }
  - name: harvest_health_multiplier
    group: "Rates: harvesting"
    type: number
    label: Resource health multiplier
    description: How much punishment a tree or rock takes before it is used up.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/HarvestHealthMultiplier }
  - name: resources_respawn_period_multiplier
    group: "Rates: harvesting"
    type: number
    label: Resource respawn period multiplier
    description: Lower is faster. This one is inverted relative to the others here.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ResourcesRespawnPeriodMultiplier }
  - name: player_harvesting_damage_multiplier
    group: "Rates: harvesting"
    type: number
    label: Player harvesting damage multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/PlayerHarvestingDamageMultiplier }
  - name: dino_harvesting_damage_multiplier
    group: "Rates: harvesting"
    type: number
    label: Creature harvesting damage multiplier
    min: 0
    step: 0.001
    default: "3.2"
    optional: true
    to: { file: config/LinuxServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/DinoHarvestingDamageMultiplier }
  - name: supply_crate_loot_quality_multiplier
    group: "Rates: harvesting"
    type: number
    label: Supply crate loot quality multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/SupplyCrateLootQualityMultiplier }
  - name: crop_growth_speed_multiplier
    group: "Rates: harvesting"
    type: number
    label: Crop growth speed multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/CropGrowthSpeedMultiplier }
  - name: crop_decay_speed_multiplier
    group: "Rates: harvesting"
    type: number
    label: Crop decay speed multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/Game.ini, key: /Script/ShooterGame.ShooterGameMode/CropDecaySpeedMultiplier }
  - name: use_optimized_harvesting_health
    group: "Rates: harvesting"
    type: bool
    label: Optimised harvesting health
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/UseOptimizedHarvestingHealth }
  - name: clamp_resource_harvest_damage
    group: "Rates: harvesting"
    type: bool
    label: Clamp resource harvest damage
    description: Stops a very high-damage creature wasting most of a resource node.
    true_value: "True"
    false_value: "False"
    default: "False"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ClampResourceHarvestDamage }
  - name: resource_no_replenish_radius_players
    group: "Rates: harvesting"
    type: number
    label: No-replenish radius around players
    description: Resources do not respawn this close to a player. Lower means they respawn nearer.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ResourceNoReplenishRadiusPlayers }
  - name: resource_no_replenish_radius_structures
    group: "Rates: harvesting"
    type: number
    label: No-replenish radius around structures
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/ResourceNoReplenishRadiusStructures }

  # ---- Rates: taming -----------------------------------------------------
  - name: taming_speed_multiplier
    group: "Rates: taming"
    type: number
    label: Taming speed multiplier
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/TamingSpeedMultiplier }
  - name: passive_tame_interval_multiplier
    group: "Rates: taming"
    type: number
    label: Passive tame interval multiplier
    description: The wait between feeds when passive-taming. Lower is faster.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/PassiveTameIntervalMultiplier }
  - name: dino_character_food_drain_multiplier
    group: "Rates: taming"
    type: number
    label: Creature food drain multiplier
    description: Also affects how fast a creature being tamed eats.
    min: 0
    step: 0.001
    default: "1.0"
    optional: true
    to: { file: config/LinuxServer/GameUserSettings.ini, key: ServerSettings/DinoCharacterFoodDrainMultiplier }
  - name: allow_raid_dino_feeding
    group: "Rates: taming"
    type: bool
    label: Allow feeding raid creatures
    description: Titanosaurs and similar can be kept fed rather than being lost after a fixed time.
    true_value: "True"
