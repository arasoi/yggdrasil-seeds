    editable: true
  - name: server_player_max_num
    group: Server
    type: number
    label: Max players
    description: >-
      Maximum number of players who can join the server. Config key:
      ServerPlayerMaxNum.
    min: 1
    max: 32
    step: 1
    default: "32"
    editable: true
  - name: community_server
    group: Server
    type: bool
    # A whole flag as the true value, empty as the false one: the game has no
    # -publiclobby=0, so "off" is the flag being absent. It sits on the command
    # line rather than in the config file because registration is a launch
    # decision, not one of the 119 ini keys.
    true_value: "-publiclobby"
    false_value: ""
    label: List in the community server browser
    description: >-
      Registers the server with Palworld's public Community Servers list, so
      players can find it by name in-game instead of being handed an address.
      The name, description and password above are what they see. Needs the
      server to be reachable from the internet -- the port forwarded, and
      Public IP set if it cannot be detected -- since the browser lists an
      address players then connect to directly.
    # Off by default. Turning it on publishes this server, its name and its
    # description to a public list, which is an operator's decision to make
    # rather than a default to inherit; and a server that is not reachable from
    # the internet would be listed as something nobody can join.
    default: ""
    editable: true
  - name: server_name
    group: Server
    label: Server name
    description: >-
      What appears in the community server list. Config key: ServerName.
    default: "Default Palworld Server"
    editable: true
  - name: server_description
    group: Server
    label: Server description
    description: >-
      Shown beside the name in the community server list. Config key:
      ServerDescription.
    default: ""
    editable: true
  - name: admin_password
    group: Server
    type: password
    label: Admin password
    description: >-
      Password used to obtain administrative privileges on the server, and the
      password RCON authenticates with. Config key: AdminPassword.
    default: ""
    editable: true
  - name: server_password
    group: Server
    type: password
    label: Join password
    description: >-
      Password required to log in to the server. Blank leaves the server open. Config
      key: ServerPassword.
    default: ""
    editable: true
  - name: allow_client_mod
    group: Server
    type: bool
    true_value: "True"
    false_value: "False"
    label: Allow modded clients
    description: >-
      Allow players with mods enabled to join the server. Config key: bAllowClientMod.
    default: "True"
    editable: true
  - name: public_ip
    group: Server
    label: Advertised IP
    description: >-
      Explicitly advertise this external IP to the community server list. Blank lets
      the server work it out, which is usually right. Config key: PublicIP.
    default: ""
    editable: true
  - name: region
