id: core-keeper
schema: 3
name: Core Keeper
description: >
  Pugstorm's underground mining, crafting and exploration sandbox for up to 100
  players. Steam players join by Game ID; everyone else connects directly by
  address and password.
version: "1.0.0"

branding:
  steam_app_id: 1621690
  icon: icon.jpg
  logo: logo.png
  banner: banner.jpg

architectures: [amd64]

# Native Linux depot 1963722. Its own _launch.sh starts Xvfb before the server;
# the image does that instead (YGG_XVFB, base-steamcmd, Yggdrasil 0.75.3 /
# ADR-204), so this runs CoreKeeperServer directly. Cross-checked against the
# pelican-eggs/games-steamcmd Core Keeper egg.
install:
  shared: false
  mount: { path: /game, mode: ro }
  image: { base: steamcmd }
  steps:
    - op: steamcmd
      app_id: 1963720

server:
  writable_paths:
    # Saves, ServerConfig.json and Admins.json live in
    # ~/.config/unity3d/Pugstorm/Core Keeper/DedicatedServer. HOME is the
    # writable path so the privilege drop inherits the agent's uid.
    - { from: home, to: /home/steam }

containers:
  - role: game
    primary: true
    image: { base: steamcmd }
    # Verified on inari without a display: the server stops at "Desktop is 0 x
    # 0" and never opens a session. "-logfile -" sends Unity's log to stdout
    # (the console) instead of a file beside the read-only executable.
    # The server also fails to write GameInfo.txt/GameID.txt next to the
    # executable; that is harmless -- the Game ID is in the log (shown as a
    # fact below) and is kept with the world once one has been saved.
    command: >-
      /game/CoreKeeperServer -batchmode -logfile -
      -port {{.Ports.game}}
      -world {{.Vars.world_index}}
      -worldname {{shellquote .Vars.world_name}}
      -worldmode {{.Vars.world_mode}}
      -maxplayers {{.Vars.max_players}}
      {{if .Vars.world_seed}}-worldseed {{shellquote .Vars.world_seed}}{{end}}
      {{if .Vars.game_id}}-gameid {{.Vars.game_id}}{{end}}
      {{if .Vars.password}}-password {{shellquote .Vars.password}}{{end}}
    workdir: /home/steam
    env:
      HOME: /home/steam
      YGG_DROP_PRIVS: "1"
      YGG_XVFB: "1"
      LD_LIBRARY_PATH: /game/linux64
    ports:
      # Verified live: -port N binds UDP N (dual-stack) for direct connections
      # and UDP N+1 beside it, which nothing configures.
      - { name: game, protocol: udp, default: 27015, kind: game }
      - { name: query, protocol: udp, offset_from: game, offset: 1, kind: query }

# Copied from a real boot (game 1.3.0.7, 2026-11-18): the line carries
# address;port;GameID;password once the world is up.
ready:
  mode: log
  pattern: "Started session with info:"
  timeout: 300s

# Verified live: SIGINT ("Got quit request") saves the world and exits 0, and
# the next start logs "successfully loaded world file".
stop:
  timeout: 60s
  then: SIGINT

logs:
  values:
    - { name: game_id, label: "Game ID", fleet: true, pattern: 'Started session with info: [^;]*;[^;]*;([^;]+);' }
    - { name: game_version, label: "Game version", version: true, pattern: 'Game version: (\S+)' }

connect:
  label: "Direct connect"
  copy: "{{.Endpoint.game}}"

backup:
  include: [home]

groups:
  - name: World
  - name: Access

variables:
  - name: world_name
    group: World
    label: World name
    description: What connecting players see.
    default: Core Keeper Server
    editable: true
  - name: world_index
    group: World
    type: number
    label: World slot
    description: Which of the server's 30 save slots to run. Changing it starts or loads a different world.
    min: 0
    max: 29
    step: 1
    default: "0"
    editable: true
  - name: world_mode
    group: World
    type: select
    label: World mode
    description: Fixed when a world is first created.
    default: Normal
    editable: true
    options:
      - { value: Normal }
      - { value: Hard }
      - { value: Casual }
      - { value: Creative }
  - name: world_seed
    group: World
    label: World seed
    description: Only used when a new world is created. Blank picks a random one.
    default: ""
    editable: true
  - name: max_players
    group: Access
    type: number
    label: Max players
    min: 1
    max: 100
    step: 1
    default: "100"
    editable: true
  - name: password
    group: Access
    type: password
    label: Direct-connect password
    description: >-
      Players joining by address need it. Blank lets the server pick one,
      shown at the end of the "Started session" line in the console.
    default: ""
    editable: true
  - name: game_id
    group: Access
    label: Game ID
    description: >-
      Blank keeps the one the server generated. To choose your own: 15 to 28
      letters and digits, without Y, y, x, 0 or O.
    default: ""
    editable: true
