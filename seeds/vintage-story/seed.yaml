id: vintage-story
schema: 3
name: Vintage Story
icon: "🪨"
description: >
  Dedicated server for Vintage Story, a sandbox survival and building game.
  Each server gets its own copy of the game files, so different worlds can run
  different versions.
version: "2.0.2"

# Not on Steam, so no steam_app_id -- both images come from the developer's
# own wiki (wiki.vintagestory.at, run by Anego Studios themselves): the
# game's own square logo, and their release-announcement key art as banner.
branding:
  logo: logo.png
  banner: banner.png

# Confirmed only against the linux-x64 server tarball (the templated URL
# below). An ARM64 dedicated server tarball was not found published anywhere
# alongside the x64 one, and the wiki's only ARM64 note concerns the
# *client* (Harmony-patched mods do not work there, for want of MonoMod
# support) rather than confirming a server build exists at all — so this
# stays amd64-only rather than guessing a second URL that may not resolve.
architectures: [amd64]

install:
  # Each server gets its own copy of the game. Two Vintage Story worlds have
  # no more reason to share one install than two Valheim or Paper servers do
  # (same call those seeds make) — and a shared install cannot reference
  # per-server data, which the download URL below, an editable variable,
  # would otherwise be tempted to become.
  shared: false
  mount: { path: /game, mode: ro }
  # download/extract need no container (NeedsImage is false for both), so
  # this install runs entirely in the agent process. No install.image,
  # matching Paper's plain download install.
  #
  # This used to also fetch its own .NET runtime tarball straight from
  # Microsoft's build CDN, unpacked alongside the game, and ran through it
  # directly (base-linux, no base-dotnet). That path produced a corrupted
  # /game/dotnet/dotnet: execing it printed raw bytes back as a garbled
  # shell script ("ELF" and other binary fragments echoed as "not found"),
  # the textbook symptom of a shell's execve() falling back to
  # script-interpretation because the file it tried to run was not a valid
  # native executable for this host — with no checksum on that download to
  # have caught it. images/base-dotnet already carries a pinned, apt-
  # installed .NET runtime (signed by Microsoft's own repo, ADR-047's
  # amendment) that base-java and other seeds already run against
  # successfully, so this now runs on it instead of fetching a second,
  # unverified copy of the same runtime at install time. That also is what
  # moves this seed onto .NET 10 (Vintage Story's current requirement) —
  # base-dotnet's own pin, not a URL guessed here.
  steps:
    # The official download page's "Linux tar.gz Archive (server only)" link,
    # per the dedicated-server guide. Templated the same way Paper's own jar
    # URL is (ADR-018's own install mechanism is a plain fetch-and-place, not
    # an API lookup), since there is no stable "latest stable" URL published
    # for it either — bumping the game version is editing this field.
    - op: download
      name: "Downloading Vintage Story server"
      url: "{{.Vars.vintagestory_download_url}}"
      into: vs_server.tar.gz
    # The server tarball extracts flat (VintagestoryServer.dll, Lib/, assets/
    # etc. all at top level) — the wiki's own `tar -C server -xzf ...`
    # unpacks it the same way with no strip needed, so neither does this.
    - op: extract
      name: "Extracting Vintage Story server"
      from: vs_server.tar.gz
      archive: targz

server:
  # Everything Vintage Story owns — serverconfig.json, Saves/, Mods/, logs —
  # lives directly under --dataPath with no further split, the same
  # single-root shape Paper's and Valheim's own writable_paths already use.
  writable_paths:
    - { from: "", to: /data }

config:
  files:
    - path: serverconfig.json
      source_path: configs/serverconfig.json.tmpl
      # `always`, deliberately: every field this template writes is backed by
      # an editable variable, and a Settings-tab save only takes effect if the
      # rebuild it triggers (ADR-062) actually rewrites the file — the same
      # reasoning that keeps Paper's server.properties on `always` rather than
      # `once`. The cost is the same one Paper accepts: an operator's own
      # direct edit to this file is discarded on the next rebuild, and so is
      # anything changed in-game with /worldconfig that this template also
      # writes.
      #
      # This is a whole-file template rather than a `settings` block with
      # `manage: patch`, on purpose. JSON patching in this codebase always
      # writes a value as a JSON *string* (internal/configfile's own
      # setMapPath: "the value is written as a string, always... A game that
      # needs a real JSON number in its config is a case for a whole-file
      # template, and the spec says so"). MaxClients, Port, WhitelistMode and
      # the AllowXxx flags are real JSON numbers and booleans in Vintage
      # Story's own config, not strings — patching them through would hand a
      # strict .NET JSON deserializer a type it very likely does not accept.
      # A template controls the literal token written, so a bool var renders
      # as the bare `true`/`false` a JSON boolean actually needs.
      #
      # It is also why every control below is a `variable` rather than a
      # `setting`: a setting's `to: {file, key}` destination is only valid
      # against a file managed `patch` (docs/seed-spec.md §7.3), which this
      # file cannot be for the reason above. Paper's own 44 controls are
      # variables through a whole-file template for the same reason.
      #
      # The `Roles` array stays hard-coded rather than becoming controls.
      # ADR-084's amendment records why it must be written at all: writing
      # this file pre-empts the game's first-run config bootstrap, so
      # `DefaultRoleCode` ("suplayer", a compiled field default) would resolve
      # against an empty list and the server kills itself at startup. Those
      # nine roles are the game's own defaults, verified against a real
      # dedicated server's serverconfig.json. Editing them is a raw-YAML job,
      # not a form field — a per-privilege UI for nine roles is a different
      # feature from configuring a server.
      manage: always

containers:
  - role: game
    primary: true
    # base-dotnet's own pinned .NET 10 runtime (images/base-dotnet/Dockerfile),
    # not a raw tarball this seed fetches and unpacks itself — see the note
    # on the install block above for why.
    image: { base: dotnet }
    # `dotnet` rather than the native ./VintagestoryServer apphost: the wiki
    # gives both as equivalent ("./VintagestoryServer or dotnet
    # VintagestoryServer.dll"), and invoking through the runtime needs no
    # executable bit surviving the download, where the apphost's would have
    # to. Bare `dotnet` resolves through base-dotnet's own PATH
    # (/usr/bin/dotnet, already set up by that image) rather than a path
    # into this install, since the runtime no longer lives there.
    #
    # --dataPath is the one documented CLI flag (the wiki's dedicated-server
    # guide shows only this one); serverconfig.json — written directly to
    # /data/serverconfig.json above, since --dataPath points straight at the
    # directory serverconfig.json lives in, not a parent of one — carries
    # everything else, confirmed against the wiki's own AppData example
    # ("Inside %AppData%/VSserverData should also be a serverconfig.json
    # file").
    command: "dotnet /game/VintagestoryServer.dll --dataPath=/data"
    workdir: /data
    ports:
      # The dedicated-server guide's router-configuration section is explicit
      # that port 42420 needs forwarding on *both* TCP and UDP — not one
      # port each, the same number twice. offset_from/offset:0 (ADR-048's
      # mechanism, used here for identity rather than a real +1 shift) is
      # what keeps them allocated to the same number instead of two
      # independent ones drifting apart, which is what two ordinary `default:`
      # ports would do the moment a second Vintage Story server shares a node.
      #
      # Which protocol actually carries player connections was not settled
      # with confidence from the wiki alone, so `kind: game` (and therefore
      # the connect link below) went on the TCP port as the better-documented
      # guess. Corroborated since: AMP's own Vintage Story template (an
      # actively-maintained third party actually running this game) declares
      # exactly one port, TCP, for game traffic, and nothing else -- not
      # independent proof against a live connection here, but real evidence
      # in the same direction rather than a second guess. Getting it wrong
      # either way costs a cosmetic connect label, not a working server —
      # both numbers are always identical, so both protocols are open
      # regardless of which one is "correct".
      - { name: game, protocol: tcp, default: 42420, kind: game }
      - { name: game-udp, protocol: udp, offset_from: game, offset: 0 }

# ---------------------------------------------------------------------------
# Groups
#
# The two wiki pages this configuration surface is built from group their
# contents very differently, and the group names below follow each page rather
# than imposing one scheme over both:
#
#   * World_Configuration has real section headings, and every "World: ..."
#     group is one of them verbatim — Player spawn and death, Survival
#     challenges, World map, Temporal stability, World generation, Multiplayer,
#     and the page's own "Configurations not in the customize world screen".
#
#   * Server_Config has NO topical sections at all. Its only headings are
#     "serverconfig.json" (with Defaults / Sample with explanations beneath it)
#     and "servermagicnumbers.json" — the body is one flat annotated JSON
#     sample. So the server-side groups here are this seed's own, ordered to
#     follow that sample's own key order rather than invented from nothing.
#     Anyone comparing the two should not go looking for "Performance" on the
#     wiki; it is not there.
#
# What is deliberately NOT exposed, and why:
#
#   * Port / Ip — Yggdrasil allocates the port (ADR-061) and the container must
#     bind every interface, so both are owned by the template, not an operator.
#   * Upnp / UpnpInfiniteLifetime — the container runtime already publishes the
#     port; UPnP from inside a container maps the wrong host.
#   * ConfigVersion ("should not be edited by hand"), ServerIdentifier,
#     VhIdentifier, NextPlayerGroupUid, LastLaunchMods, LastLaunchPlaystyle,
#     FileEditWarning — internal state the game maintains for itself.
#   * SaveFileLocation, ModPaths — paths fixed by this seed's own layout.
#   * DefaultSpawn / Roles — nested objects; see the Roles note above.
#   * OnlyWhitelisted — the wiki marks it superseded ("can be ignored").
#   * HostedMode / HostedModeAllowMods — silently disable MaxChunkRadius,
#     MaxClients, Upnp, EntityDebugMode, TickTime and RandomBlockTicksPerChunk.
#     A toggle that turns six other controls on this page into no-ops with
#     nothing on screen saying so is worse than its absence.
#   * MapSizeX/Y/Z — the same world dimensions World_Configuration documents as
#     worldWidth/worldLength, which is where they are offered below. Two
#     controls writing one concept is how they end up disagreeing.
#   * SkipEveryChunkRow / SkipEveryChunkRowWidth, RepairMode, AnalyzeMode —
#     worldgen test scaffolding and modes the wiki itself documents as
#     "Unknown".
#   * servermagicnumbers.json in its entirety — a separate file (so a second
#     config.files entry) of engine internals: thread counts, chunk queue
#     sizes, desync tolerances. Adding it is a contained follow-on if it is
#     ever wanted; guessing at it here would put a server's stability behind
#     twenty-five controls nobody has tested.
# ---------------------------------------------------------------------------
groups:
  - name: Install
    description: Applying a change here needs an install update, not just a save.
  - name: Performance
    description: >-
      Tick and view-distance tuning. Raising these costs RAM and CPU on the node.
    collapsed: true
  - name: Stability
    description: >-
      Thresholds at which the server shuts itself down rather than keep running
      in a state it cannot recover from.
    collapsed: true
  - name: Logging
    collapsed: true
  - name: Chat and groups
    collapsed: true
  - name: Mods
    collapsed: true
  - name: Startup
    collapsed: true
  - name: "World: Player spawn and death"
    description: From the World Configuration wiki page's section of the same name.
  - name: "World: Survival challenges"
    description: From the World Configuration wiki page's section of the same name.
    collapsed: true
  - name: "World: World map"
    collapsed: true
  - name: "World: Temporal stability"
    collapsed: true
  - name: "World: World generation"
    description: >-
      Most of these apply only when a world is first created — changing them
      later does nothing to terrain that already exists.
    collapsed: true
  - name: "World: Multiplayer"
    collapsed: true
  - name: "World: Advanced"
    description: >-
      The wiki's "Configurations not in the customize world screen". These
      publish no default, so each is blank here and the key is left out of the
      config entirely until you set one — which leaves the game's own built-in
      value in place rather than this seed guessing at it.
    collapsed: true

variables:
  # ---- Install ------------------------------------------------------------
  # dotnet_runtime_url is gone: the .NET runtime comes from base-dotnet's own
  # pinned apt package now, not a URL this seed fetches itself (see the
  # install block above). The migration below carries a stored override
  # forward as nothing rather than leaving it stranded under a name this
  # seed no longer declares.
  - name: vintagestory_download_url
    group: Install
    label: "Vintage Story server download URL"
    description: >-
      The "Linux tar.gz Archive (server only)" link from
      https://www.vintagestory.at/download.html — "Show all available
      downloads and mirrors" surfaces it. Applying a change here requires an
      install update, not just a settings save.
    default: "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.1.tar.gz"
    editable: true

  # ---- Server ---------------------------------------------------------------
  - name: server_name
    group: Server
    label: Server name
    description: >-
      Shown in the in-game server browser. 4-80 characters, and it must be set
      for "Advertise server" below to work at all.
    default: "A Yggdrasil server"
    editable: true
  - name: server_description
    group: Server
    label: Server description
    description: >-
      Longer text shown alongside the server name. VTML is accepted here (for
      example <br> for a line break). Leave blank for none.
    default: ""
    editable: true
  - name: welcome_message
    group: Server
    label: Welcome message
    description: >-
      Shown to a player on join. "{0}" is replaced with their name. Leave blank
      to disable it — the game crashes clients on a null, so this seed writes an
      empty string rather than removing the key.
    default: "Welcome {0}, may you survive well and prosper"
    editable: true
  - name: server_language
    group: Server
    label: Server language
    description: Two-letter ISO code deciding the language of server messages.
    default: "en"
    editable: true
  - name: server_url
    group: Server
    label: Server URL
    description: >-
      Sent to the master server. The wiki records it as having no use yet, so
      blank is the ordinary answer.
    default: ""
    editable: true
  - name: advertise_server
    group: Server
    type: bool
    label: Advertise on the public server list
    description: >-
      Publishes this server to the master server's public listing. Needs
      "Server name" set, and the game port reachable from the internet.
    true_value: "true"
    false_value: "false"
    default: "false"
    editable: true
  - name: masterserver_url
    group: Server
    label: Master server URL
    description: >-
      Where "Advertise on the public server list" publishes to. Must include
      the protocol and a trailing slash.
    default: "http://masterserver.vintagestory.at/api/v1/servers/"
    editable: true

  # ---- Players --------------------------------------------------------------
  - name: max_clients
    group: Players
    type: number
    label: Max players
    description: Higher values need more RAM and CPU on the node.
    default: "16"
    min: 1
    max: 128
    step: 1
    editable: true
  - name: max_clients_in_queue
    group: Players
    type: number
    label: Max players queued
    description: How many may wait to join once the server is full. 0 disables the queue.
    default: "0"
    min: 0
    max: 128
    step: 1
    editable: true
  - name: password
    group: Players
    type: password
    label: Password
    description: Leave blank for no password.
    default: ""
    editable: true
  - name: verify_player_auth
    group: Players
    type: bool
    label: Verify player accounts
    description: >-
      Checks each joining player against the game's auth servers. Turning this
      off lets unauthenticated clients in and is only sane on a LAN.
    true_value: "true"
    false_value: "false"
    default: "true"
    editable: true
  - name: whitelist_mode
    group: Players
    type: select
    label: Whitelist
    default: "0"
    editable: true
    options:
      - { value: "0", label: "Default (on for a dedicated server)" }
      - { value: "1", label: "Off" }
      - { value: "2", label: "On" }
  - name: default_role_code
    group: Players
    type: select
    label: Default role for new players
    description: >-
      One of the nine roles this seed writes into serverconfig.json. Naming a
      role that does not exist kills the server at startup, so this is a list
      rather than a free-text field.
    default: "suplayer"
    editable: true
    options:
      - { value: "suvisitor",       label: "Survival Visitor — chat only, cannot build" }
      - { value: "crvisitor",       label: "Creative Visitor — chat and fly, cannot build" }
      - { value: "limitedsuplayer", label: "Limited Survival Player — build in permitted areas" }
      - { value: "limitedcrplayer", label: "Limited Creative Player — build in permitted areas, fly" }
      - { value: "suplayer",        label: "Survival Player — the game's own default" }
      - { value: "crplayer",        label: "Creative Player — build anywhere, fly" }
      - { value: "sumod",           label: "Survival Moderator — kick and ban" }
      - { value: "crmod",           label: "Creative Moderator — kick, ban, fly, set game modes" }
      - { value: "admin",           label: "Admin — every privilege, including granting admin" }
  - name: client_connection_timeout
    group: Players
    type: number
    label: Client timeout (seconds)
    default: "150"
    min: 10
    max: 3600
    step: 1
    editable: true
  - name: warn_clients_after_afk_seconds
    group: Players
    type: number
    label: Warn AFK players after (seconds)
    description: 0 disables the warning.
    default: "0"
    min: 0
    max: 86400
    step: 1
    editable: true
  - name: kick_clients_after_afk_seconds
    group: Players
    type: number
    label: Kick AFK players after (seconds)
    description: 0 disables kicking.
    default: "0"
    min: 0
    max: 86400
    step: 1
    editable: true

  # ---- Gameplay -------------------------------------------------------------
  - name: allow_pvp
    group: Gameplay
    type: bool
    label: Allow PvP
    true_value: "true"
    false_value: "false"
    default: "true"
    editable: true
  - name: allow_fire_spread
    group: Gameplay
    type: bool
    label: Allow fire to spread
    true_value: "true"
    false_value: "false"
    default: "true"
    editable: true
  - name: allow_falling_blocks
    group: Gameplay
    type: bool
    label: Allow blocks to fall
    true_value: "true"
    false_value: "false"
    default: "true"
    editable: true
  - name: pass_time_when_empty
    group: Gameplay
    type: bool
    label: Keep time passing with nobody online
    true_value: "true"
    false_value: "false"
    default: "false"
    editable: true

  # ---- Performance ----------------------------------------------------------
  - name: max_chunk_radius
    group: Performance
    type: number
    label: Max view distance (chunks)
    description: The furthest a player may see. Higher values need more RAM.
    default: "12"
    min: 1
    max: 64
    step: 1
    editable: true
  - name: tick_time
    group: Performance
    label: Tick time (milliseconds)
    description: >-
      Milliseconds between server ticks; the default is 30 ticks per second
      (1000/30). A text field rather than a number one because the game's own
      default carries more decimal places than a stepped numeric control can
      express without rounding it.
    default: "33.3333321"
    editable: true
  - name: max_main_thread_block_ticks
    group: Performance
    type: number
    label: Max block ticks per server tick
    default: "10000"
    min: 100
    max: 1000000
    step: 100
    editable: true
  - name: random_block_ticks_per_chunk
    group: Performance
    type: number
    label: Random ticks per chunk
    description: Higher values make grass and crops recover faster.
    default: "16"
    min: 0
    max: 256
    step: 1
    editable: true
  - name: block_tick_chunk_range
    group: Performance
    type: number
    label: Random tick range (chunks)
    description: How far from a player chunks receive random ticks. 4 chunks is 128 blocks.
    default: "4"
    min: 1
    max: 32
    step: 1
    editable: true
  - name: block_tick_interval
    group: Performance
    type: number
    label: Random tick interval (milliseconds)
    default: "300"
    min: 10
    max: 60000
    step: 10
    editable: true
  - name: spawn_cap_player_scaling
    group: Performance
    type: number
    label: Mob cap scaling per player
    description: >-
      Raises the mob cap by this much per online player. 0 keeps one cap however
      many are on.
    default: "0.5"
    min: 0
    max: 5
    step: 0.05
    editable: true
  - name: compress_packets
    group: Performance
    type: bool
    label: Compress packets to clients
    true_value: "true"
    false_value: "false"
    default: "true"
    editable: true

  # ---- Stability ------------------------------------------------------------
  - name: die_below_disk_space_mb
    group: Stability
    type: number
    label: Shut down below free disk (MB)
    default: "400"
    min: 0
    max: 1000000
    step: 50
    editable: true
  - name: die_above_error_count
    group: Stability
    type: number
    label: Shut down above error count
    default: "100000"
    min: 0
    max: 10000000
    step: 1000
    editable: true
  - name: die_above_memory_usage_mb
    group: Stability
    type: number
    label: Shut down above memory use (MB)
    description: >-
      The game's own default is 50000 MB. Set this under the node's real memory
      limit so the server exits cleanly rather than being OOM-killed.
    default: "50000"
    min: 0
    max: 1000000
    step: 16
    editable: true
  - name: corruption_protection
    group: Stability
    type: bool
    label: Corruption protection
    description: Writes redundant data so corrupt world files can be detected.
    true_value: "true"
    false_value: "false"
    default: "true"
    editable: true
  - name: regenerate_corrupt_chunks
    group: Stability
    type: bool
    label: Regenerate corrupt chunks
    description: >-
      Replaces a corrupt chunk with freshly generated terrain. Anything built
      there is lost, which is why it is off by default.
    true_value: "true"
    false_value: "false"
    default: "false"
    editable: true

  # ---- Logging --------------------------------------------------------------
  - name: log_block_break_place
    group: Logging
    type: bool
    label: Log every block placed and broken
    description: An audit trail, and a large one on a busy server.
    true_value: "true"
    false_value: "false"
    default: "false"
    editable: true
  - name: log_file_split_after_line
    group: Logging
    type: number
    label: Split log files after (lines)
    default: "500000"
    min: 1000
    max: 100000000
    step: 1000
    editable: true
  - name: entity_debug_mode
    group: Logging
    type: bool
    label: Entity debug mode
    description: Sends extra entity detail to clients that ask for it.
    true_value: "true"
    false_value: "false"
    default: "false"
    editable: true
  - name: anti_abuse
    group: Logging
    type: number
    label: Anti-abuse level
    description: >-
      Guards against a range of malicious client behaviour. The wiki notes it
      was glitchy when introduced, so 0 remains the game's default.
    default: "0"
    min: 0
    max: 3
    step: 1
    editable: true
  - name: login_flood_protection
    group: Logging
    type: bool
    label: Login flood protection
    true_value: "true"
    false_value: "false"
    default: "false"
    editable: true
  - name: temporary_ip_block_list
    group: Logging
    type: bool
    label: Temporary IP block list
    true_value: "true"
    false_value: "false"
    default: "false"
    editable: true

  # ---- Chat and groups ------------------------------------------------------
  - name: chat_rate_limit_ms
    group: Chat and groups
    type: number
    label: Minimum time between chat messages (ms)
    default: "1000"
    min: 0
    max: 60000
    step: 100
    editable: true
  - name: max_owned_group_channels_per_user
    group: Chat and groups
    type: number
    label: Max group channels per player
    default: "10"
    min: 0
    max: 1000
    step: 1
    editable: true
  - name: group_chat_history_size
    group: Chat and groups
    type: number
    label: Group chat history size
    default: "20"
    min: 0
    max: 10000
    step: 1
    editable: true

  # ---- Mods -----------------------------------------------------------------
  - name: mod_db_url
    group: Mods
    label: Mod database URL
    description: Where /moddb install downloads from.
    default: "https://mods.vintagestory.at/"
    editable: true
  # ModIdBlackList / ModIdWhiteList are deliberately absent. Both are JSON
  # arrays, and a seed template cannot build one from a text control: the
  # renderer is text/template, whose builtin function set has no `split`. The
  # alternative — a free-text field an operator types raw JSON into — puts the
  # whole of serverconfig.json behind one unbalanced bracket, and this file is
  # rewritten on every rebuild, so a typo would leave the server unable to
  # start with nothing on the form saying which field did it. A repeating
  # list control is the real fix and is a schema change, not a seed one.
  - name: disable_mod_safety_check
    group: Mods
    type: bool
    label: Skip mod safety checks
    true_value: "true"
    false_value: "false"
