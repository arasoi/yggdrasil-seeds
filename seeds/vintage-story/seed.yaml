# `mode: port` rather than `mode: log`, deliberately. The dedicated-server
# guide does quote the exact ready line ("Dedicated Server now running on
# Port 42420 and all ips!"), but this project's own convention (see
# Valheim's and ARK's seeds) is to only declare a log pattern once it has
# been seen against a real, running server — this one has not been run here.
# `mode: port` needs no game-specific knowledge and is the documented right
# first choice for a game added blind (ADR-077 / docs/seed-spec.md §9.1).
ready:
  mode: port
  port: game
  timeout: 300s

# `/stop` is the documented console command ("Then do /stop and relaunch
# Vintagestoryserver.exe"), sent to the primary container's stdin before
# escalating — unverified how long a large world takes to flush, so the
# timeout is generous rather than tight, the same margin Valheim's own
# (verified) stop block reasons about for a long-played world.
stop:
  command: "/stop"
  timeout: 90s
  then: SIGTERM

connect:
  label: "Direct connect"
  copy: "{{.Endpoint.game}}"

backup:
  include_root: true

# dotnet_runtime_url no longer exists (the runtime moved to base-dotnet's own
# apt package, see the install block above) — dropped rather than left
# stranded under a name this seed no longer declares, so a server created
# under the old shape does not carry a dead override forward for no reason.
#
# Every variable that existed before this release keeps its exact name, so no
# rename migration is needed: server_name, server_description, welcome_message,
# max_clients, password, whitelist_mode, pass_time_when_empty, allow_pvp,
# allow_fire_spread, allow_falling_blocks, world_name, world_seed and
# play_style all still resolve to the operator's stored value. Only their
# `group` changed, which is presentation and is not stored per server.
migrations:
  - drop: dotnet_runtime_url
